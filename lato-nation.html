<style>

.lt-nation .ln-chk li.warn{color:#8a5a00;}
.lt-nation .ln-chk li.warn:before{content:'！';}
.lt-nation .ln-chk li.info{color:#555;}
.lt-nation .ln-chk li.info:before{content:'ⓘ';}

.lt-nation table.ln-rv textarea{width:100%;box-sizing:border-box;}
.lt-nation table.ln-tbl.ln-rv td.n{text-align:left;}

@media (max-width:640px){
.lt-nation .lt-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.lt-nation .lt-tabs button{flex:0 0 auto;}
.lt-nation table.ln-it,.lt-nation table.ln-it tbody{display:block;}
.lt-nation table.ln-it tr:first-child{display:none;}
.lt-nation table.ln-it tr{display:block;padding:6px 0;border-bottom:1px solid #e3ddd2;}
.lt-nation table.ln-it td{display:block;border:0;padding:0;}
.lt-nation table.ln-it td:first-child{font-weight:600;font-size:12.5px;}
.lt-nation table.ln-it td[data-lb]::before{display:none;}
.lt-nation table.ln-it input[type=text]{width:100%!important;box-sizing:border-box;margin-top:3px;}
}
.lt-nation table.ln-lt textarea{min-width:14em;}

  if(full&&a<1e8)s=fmt(v,0);else if(a>=1e12)s=fmt(v/1e12,2)+'兆';else if(a>=1e11)s=fmt(v/1e8,0)+'億';else if(a>=1e8)s=fmt(v/1e8,1)+'億';else if(a>=1e6)s=fmt(v/1e4,0)+'萬';else if(a>=1e4)s=fmt(v/1e4,1)+'萬';else s=fmt(v,0);

  if(d.info&&has(d.info.census)&&d.demo&&!(d.demo.census||[]).length){var p=numIn(d.info.census);if(p>0)d.demo.census=[{year:String(d.info.censusYear||''),pop:String(p),note:''}];}

/* 解析 {{國家資訊面板|…}}（略過 [[…]] 與 {{…}} 內的分隔線） */
function parseTemplate(text){var key='{{國家資訊面板',i=text.indexOf(key);if(i<0)return null;i+=key.length;var dep=0,cur='',ps=[],n=text.length;
  for(;i<n;i++){var ch=text.charAt(i),nx=text.charAt(i+1);
    if((ch==='{'&&nx==='{')||(ch==='['&&nx==='[')){dep++;cur+=ch+nx;i++;continue;}
    if((ch==='}'&&nx==='}')||(ch===']'&&nx===']')){if(dep===0&&ch==='}')break;dep--;cur+=ch+nx;i++;continue;}
    if(ch==='|'&&dep===0){ps.push(cur);cur='';continue;}cur+=ch;}
  ps.push(cur);var o={};ps.forEach(function(p){var j=p.indexOf('=');if(j<0)return;var k=p.slice(0,j).trim();if(k)o[k]=p.slice(j+1).trim();});return o;}

function pnum(s){s=String(s||'');var m=s.replace(/,/g,'').match(/-?\d+(\.\d+)?/);if(!m)return NaN;var v=+m[0];if(/兆/.test(s))v*=1e12;else if(/億/.test(s))v*=1e8;else if(/萬/.test(s))v*=1e4;return v;}

      (rr.notes.length?lines(rr.notes):'')+(rr.unk.length?'<div class="ln-note">未辨識的行（前 8 行）：'+rr.unk.map(esc).join('；')+'</div>':''));say('已匯入貼上的文字。');}
  else if(act==='expJson')dl(fname('.nation.json'),JSON.stringify({format:'LatoNation',v:2,saved:new Date().toISOString(),data:N},null,1),'application/json');
  else if(act==='expTxt')dl(fname('_計算書.txt'),plainText(X));
  else if(act==='expWiki')dl(fname('_維基.txt'),article(X)+'\n\n<!-- ===== 討論頁 ===== -->\n\n'+talkPage(X));
  else if(act==='copy'){var t=q('outText').value,done=function(){var m=q('outMsg');if(m)m.textContent='已複製';};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){var ta=q('outText');ta.select();try{document.execCommand('copy');done();}catch(e){}});else{var ta=q('outText');ta.select();try{document.execCommand('copy');done();}catch(e){}}}
  else if(act==='dlOut'){var o2=OUTS.filter(function(o){return o[0]===OUTV;})[0];dl(fname('_'+(o2?o2[1].replace(/[（）()\s]/g,''):'輸出')+'.txt'),q('outText').value);}
  else if(act==='resalt'){N.pol.salt=(+N.pol.salt||0)+1;schedule();}
  else if(act==='goChk'){tab('calc');var c=root.querySelector('[data-r="chk"]');if(c)c.scrollIntoView({behavior:'smooth',block:'center'});}
  else if(act==='goSim'){tab('calc');var sc=root.querySelector('[data-sec="sim"]');if(sc)sc.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(act==='hhPreset'){if(!window.confirm('套用「'+sysName('reg',N.sys.reg)+'」範本會取代目前「戶籍與階層」分頁的各表。確定？'))return;N.hh=hhPreset(N.sys.reg);renderLists();fill();update();say('已套用戶籍範本。');}
  else if(act==='refClr'){N.ref=null;update();}
  else if(act==='simCopy'){var s=N.calc.sim;SIMK.forEach(function(k){s[k[0]]=N.calc[k[0]]||'';});['hab','dev','econ','ind','mil'].forEach(function(k){s.w[k]=N.calc.w[k]||'';});fill(root.querySelector('[data-sec="sim"]'));update();say('已把正式數值複製到試算區，可直接修改。');}
  else if(act==='simClear'){var on=N.calc.sim.on;N.calc.sim=newSim();N.calc.sim.on=false;fill(root.querySelector('[data-sec="sim"]'));update();if(on)say('已清空試算值，恢復使用正式數值。');}
  else if(act==='regAdd'){regPut(N);REG.forEach(function(r){r.S=null;});regSave();update();say('已將目前國家加入名冊。');}
  else if(act==='regImp')q('regFile').click();
  else if(act==='regExp')dl('lato-nations.registry.json',JSON.stringify({format:'LatoNationRegistry',v:2,saved:new Date().toISOString(),nations:REG.map(function(r){return {id:r.id,N:r.N};})},null,1),'application/json');
  else if(act==='regClr'){if(!window.confirm('清空名冊？（不影響目前國家）'))return;REG=[];regSave();update();}
  else if(act==='regDel'){REG=REG.filter(function(r){return r.id!==id;});regSave();update();}
  else if(act==='regLoad'){var e=REG.filter(function(r){return r.id===id;})[0];if(!e||!window.confirm('載入「'+(e.N.info.name||e.N.info.short||'')+'」會取代目前的草稿。確定？'))return;loadNation(JSON.parse(JSON.stringify(e.N)));tab('calc');}
  else if(act==='regMed'){var md=regMedians();if(!(md.gdp>0))return;N.rules.avg={gdp:md.gdp,pop:md.pop,def:md.def,army:md.army};fill(root.querySelector('[data-pane="rules"]'));update();say('已以名冊中位數更新平均國數值（'+md.n+' 國）。');}
  else if(act==='rulesSave'){lsSet('latoNation.rules',N.rules);say('已存為預設規則參數。');}
  else if(act==='rulesLoad'){var rr2=lsGet('latoNation.rules');if(rr2){N.rules=merge(defRules(),rr2);fill();update();say('已套用預設規則參數。');}else say('尚未儲存預設規則參數。');}
  else if(act==='rulesReset'){N.rules=defRules();fill();update();say('已還原規則原值。');}}
function init(){layout();var d=lsGet('latoNation.draft');N=d?merge(newNation(),migrate(d)):newNation();if(!d){var r=lsGet('latoNation.rules');if(r)N.rules=merge(defRules(),r);}if(!N.id)N.id=newId();
  REG=(lsGet('latoNation.reg')||[]).filter(function(x){return x&&x.N;}).map(function(x){return {id:x.id,N:merge(newNation(),migrate(x.N))};});
  root.addEventListener('input',onEdit);root.addEventListener('change',onEdit);root.addEventListener('click',onClick);
  renderLists();fill();update();if(d)say('已載入此瀏覽器暫存的草稿。');}
init();
})();
</script>
</body></html>
