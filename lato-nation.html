.lato-tool input[type=number]{width:74px;}
.lato-tool input[type=color]{width:34px;height:26px;padding:0;border:1px solid #ccc;border-radius:4px;vertical-align:middle;}
.lato-tool input[type=range]{width:90px;vertical-align:middle;}
.lato-tool button{padding:4px 12px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;cursor:pointer;font-size:13px;}
.lato-tool button:hover{background:#f0f0f0;}
.lato-tool .lt-cv{width:100%;min-height:120px;display:block;border:1px solid #ccc;border-radius:8px;background:#f6f6f6;}
.lato-tool .lt-err{color:#b3261e;font-size:13px;margin:0 0 8px;min-height:1em;}
.lato-tool .lt-info{font-size:13px;color:#555;margin:0 0 8px;line-height:1.7;}
.lato-tool .lt-chip{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;vertical-align:middle;margin-left:4px;}
.lato-tool .lt-cl{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:12px;}
.lato-tool .lt-mk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #b3261e;border-radius:50%;pointer-events:none;display:none;}
.lt-terrain .lt-scroll{max-height:260px;overflow:auto;margin:4px 0;}
.lt-terrain .lt-scroll input[type=number]{padding:1px 3px;font-size:12px;}
/* ===== LatoNation 新增：以下附加到 MediaWiki:Gadget-LatoTools.css 末尾 ===== */
.lato-tool select,.lato-tool input[type=text],.lato-tool input[type=number],.lato-tool input[type=date]{font-size:13px;padding:3px 6px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;}
.lato-tool .lt-pri{background:#222;border-color:#222;color:#fff;}
.lato-tool .lt-pri:hover{background:#444;}
.lato-tool .lt-grp{border:1px solid #ddd;border-radius:8px;padding:0 10px;margin:0 0 8px;}
.lato-tool .lt-grp>summary{cursor:pointer;padding:6px 0;font-size:13px;color:#333;}
.lt-nation textarea{width:100%;box-sizing:border-box;font:12px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;border:1px solid #ccc;border-radius:6px;padding:4px 6px;}
.lt-nation .ln-bar{position:sticky;top:0;z-index:5;background:#fffdf8;border:1px solid #d9d2c3;border-radius:8px;padding:6px 10px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.lt-nation .ln-bar .nm{font-size:15px;font-weight:600;color:#3E2723;}
.lt-nation .ln-chip{white-space:nowrap;color:#555;}
.lt-nation .ln-chip b{color:#222;font-size:14px;margin-left:3px;}
.lt-nation .ln-lv{display:inline-block;padding:0 6px;border-radius:4px;background:#3E2723;color:#fff;font-size:12px;margin-left:4px;}
.lt-nation .ln-st{cursor:pointer;white-space:nowrap;}
.lt-nation .ln-st.bad{color:#b3261e;}
.lt-nation .ln-st.warn{color:#8a5a00;}
.lt-nation .ln-st.ok{color:#2e7d32;}
.lt-nation .ln-act{gap:6px;}
.lt-nation .ln-save{font-size:12px;color:#888;}
.lt-nation .lt-tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 10px;border-bottom:1px solid #ddd;padding-bottom:6px;}
.lt-nation .lt-tabs button.on{background:#3E2723;color:#fff;border-color:#3E2723;}
.lt-nation .ln-pane{display:none;}

.lt-nation .ln-tile .v{font-size:17px;font-weight:600;color:#222;white-space:nowrap;}
.lt-nation .ln-tile .s{font-size:11px;color:#777;}
.lt-nation .ln-chk{list-style:none;margin:4px 0;padding:0;font-size:13px;}
.lt-nation .ln-chk li{padding:2px 0 2px 22px;position:relative;line-height:1.55;}
.lt-nation .ln-chk li:before{position:absolute;left:2px;font-weight:700;}
.lt-nation .ln-chk li.err{color:#b3261e;}
.lt-nation .ln-chk li.err:before{content:'✕';}
.lt-nation .ln-chk li.warn{color:#8a5a00;}
.lt-nation .ln-chk li.warn:before{content:'！';}
.lt-nation .ln-chk li.info{color:#555;}
.lt-nation .ln-chk li.info:before{content:'ⓘ';}
.lt-nation .ln-chk li.miss{color:#555;}
.lt-nation .ln-chk li.miss:before{content:'…';}
.lt-nation .ln-die{white-space:nowrap;}
.lt-nation .ln-dn{font-size:11px;color:#fff;background:#6D4C41;border-radius:4px;padding:0 4px;}
.lt-nation .ln-dv{font-size:12px;color:#2e7d32;}
.lt-nation .ln-dv.bad{color:#b3261e;}
.lt-nation table.ln-lt,.lt-nation table.ln-tbl{border-collapse:collapse;font-size:12.5px;}

.lt-nation table.ln-lt td,.lt-nation table.ln-tbl td{border-bottom:1px solid #eee;padding:3px 6px;vertical-align:top;}
.lt-nation table.ln-tbl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.lt-nation table.ln-tbl tr.sum td{font-weight:600;border-top:1px solid #bbb;}
.lt-nation table.ln-tbl td.ov input{width:5.5em;}
.lt-nation .ln-x{padding:1px 6px;font-size:12px;color:#b3261e;}
.lt-nation .ln-sc{overflow:auto;max-width:100%;}
.lt-nation .ln-note{font-size:12px;color:#777;line-height:1.6;}
.lt-nation .ln-hi{background:#fff3cd;}
.lt-nation textarea.ln-out{height:440px;font:12px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;white-space:pre;}
.lt-nation .ln-tip{position:fixed;pointer-events:none;background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 8px;font-size:12px;line-height:1.5;color:#555;box-shadow:0 2px 6px rgba(0,0,0,.15);display:none;z-index:30;max-width:260px;}

.lt-nation .ln-sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}
.lt-nation .ln-ch{margin:6px 0 4px;}
.lt-nation .ln-ch svg{display:block;max-width:100%;height:auto;overflow:visible;}
.lt-nation .ln-ch .t{font-size:13px;color:#333;font-weight:600;margin:0 0 2px;}
.lt-nation .ln-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:10px;}
.lt-nation .ln-rule{font-size:13px;line-height:1.75;color:#444;}
.lt-nation .ln-rule li{margin:0 0 4px;}
.lt-nation .ln-sep{display:inline-block;width:1px;height:22px;background:#d9d6cf;margin:0 4px;}

.lt-nation table.ln-lt thead,.lt-nation table.ln-rv tr:first-child{display:none;}
.lt-nation table.ln-lt tr,.lt-nation table.ln-rv tr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px;padding:6px 0;border-bottom:1px solid #e3ddd2;}
.lt-nation table.ln-lt td,.lt-nation table.ln-rv td{display:block;border:0;padding:0;min-width:0!important;text-align:left;}
.lt-nation table.ln-lt td:last-child{margin-left:auto;}
.lt-nation table.ln-rv td:first-child,.lt-nation table.ln-rv td:nth-child(6),.lt-nation table.ln-rv td:nth-child(7){flex:1 1 100%;}
.lt-nation table.ln-rv textarea{width:100%;box-sizing:border-box;}
.lt-nation table.ln-tbl.ln-rv td.n{text-align:left;}
.lt-nation td[data-lb]::before{content:attr(data-lb);display:block;font-size:11px;font-weight:400;color:#8a8178;line-height:1.5;}
}
body{margin:0;padding:12px;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#fafafa;color:#222;}

  if(el.getAttribute('data-k')==='hdiR'){N.calc.hdi=(+el.value).toFixed(3);fill(root.querySelector('[data-sec="s8"]'));schedule();return;}
  if(el.getAttribute('data-k')==='impFile'||el.getAttribute('data-k')==='regFile'){if(ev.type!=='change')return;var fs=el.files,toReg=el.getAttribute('data-k')==='regFile';for(var i=0;fs&&i<fs.length;i++)readJSON(fs[i],function(o){importObj(o,toReg);});el.value='';return;}
  var p=el.getAttribute('data-b');if(!p)return;var v=el.type==='checkbox'?el.checked:el.value,mul=el.getAttribute('data-mul');if(mul){var x=num(v);v=isFinite(x)?x*(+mul):'';}
  setP(N,p,v);root.querySelectorAll('[data-b="'+p+'"]').forEach(function(o){if(o!==el)put(o,getP(N,p));});schedule();}
function onClick(ev){var b=ev.target.closest?ev.target.closest('[data-tab],[data-add],[data-del],[data-out],[data-act]'):null;if(!b||!root.contains(b))return;
  if(b.hasAttribute('data-tab')){tab(b.getAttribute('data-tab'));return;}
  if(b.hasAttribute('data-out')){OUTV=b.getAttribute('data-out');paintOut();return;}
  if(b.hasAttribute('data-add')){var a=b.getAttribute('data-add').split(':'),L=LIST[a[0]],arr=getP(N,L.p);if(!Array.isArray(arr)){arr=[];setP(N,L.p,arr);}if(L.max&&arr.length>=L.max){say('「'+a[0]+'」最多 '+L.max+' 項（資訊面板的欄位上限）。');return;}
    arr.push(L.add(a[1]));renderList(a[0]);schedule();return;}
  if(b.hasAttribute('data-del')){var d=b.getAttribute('data-del').split(':'),L2=LIST[d[0]],arr2=getP(N,L2.p);arr2.splice(+d[1],1);renderList(d[0]);schedule();return;}
  var act=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(act==='new'){if(!window.confirm('新建國家會取代目前的草稿（請先匯出國家檔保存）。確定？'))return;var r=lsGet('latoNation.rules');var n2=newNation();if(r)n2.rules=merge(defRules(),r);loadNation(n2);tab('calc');say('已新建國家。');}
  else if(act==='example'){if(!window.confirm('載入規則範例會取代目前的草稿。確定？'))return;loadNation(exampleNation());tab('calc');say('已載入規則範例（普通玩家、混合國家）。');}
  else if(act==='imp')q('impFile').click();
  else if(act==='impWiki'){q('wikiBox').style.display='';q('wikiIn').focus();}
  else if(act==='impWikiX')q('wikiBox').style.display='none';
  else if(act==='impWikiGo'){var o=parseTemplate(q('wikiIn').value);if(!o){say('找不到 {{國家資訊面板 …}}。');return;}var cnt=applyInfobox(o);renderLists();fill();update();q('wikiBox').style.display='none';q('wikiIn').value='';say('已從資訊面板匯入 '+cnt+' 項資料。');}
  else if(act==='expJson')dl(fname('.nation.json'),JSON.stringify({format:'LatoNation',v:1,saved:new Date().toISOString(),data:N},null,1),'application/json');
  else if(act==='expTxt')dl(fname('_計算書.txt'),plainText(X));
  else if(act==='expWiki')dl(fname('_維基.txt'),article(X)+'\n\n<!-- ===== 討論頁 ===== -->\n\n'+talkPage(X));
  else if(act==='copy'){var t=outText(),done=function(){var m=q('outMsg');if(m)m.textContent='已複製';};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,function(){var ta=q('outText');ta.select();try{document.execCommand('copy');done();}catch(e){}});else{var ta=q('outText');ta.select();try{document.execCommand('copy');done();}catch(e){}}}
  else if(act==='dlOut')dl(fname({ib:'_資訊面板.txt',art:'_條目.txt',talk:'_討論頁.txt',txt:'_計算書.txt'}[OUTV]),outText());
  else if(act==='resalt'){N.pol.salt=(+N.pol.salt||0)+1;schedule();}
  else if(act==='goChk'){tab('calc');var c=q('bar');if(c)root.querySelector('[data-r="chk"]').scrollIntoView({behavior:'smooth',block:'center'});}
  else if(act==='regAdd'){regPut(N);REG.forEach(function(r){r.S=null;});regSave();update();say('已將目前國家加入名冊。');}
  else if(act==='regImp')q('regFile').click();
  else if(act==='regExp')dl('lato-nations.registry.json',JSON.stringify({format:'LatoNationRegistry',v:1,saved:new Date().toISOString(),nations:REG.map(function(r){return {id:r.id,N:r.N};})},null,1),'application/json');
  else if(act==='regClr'){if(!window.confirm('清空名冊？（不影響目前國家）'))return;REG=[];regSave();update();}
  else if(act==='regDel'){REG=REG.filter(function(r){return r.id!==id;});regSave();update();}
  else if(act==='regLoad'){var e=REG.filter(function(r){return r.id===id;})[0];if(!e||!window.confirm('載入「'+(e.N.info.name||e.N.info.short||'')+'」會取代目前的草稿。確定？'))return;loadNation(JSON.parse(JSON.stringify(e.N)));tab('calc');}
  else if(act==='regMed'){var md=regMedians();if(!(md.gdp>0))return;N.rules.avg={gdp:md.gdp,pop:md.pop,def:md.def,army:md.army};fill(root.querySelector('[data-pane="rules"]'));update();say('已以名冊中位數更新平均國數值（'+md.n+' 國）。');}
  else if(act==='rulesSave'){lsSet('latoNation.rules',N.rules);say('已存為預設規則參數。');}
  else if(act==='rulesLoad'){var rr=lsGet('latoNation.rules');if(rr){N.rules=merge(defRules(),rr);fill();update();say('已套用預設規則參數。');}else say('尚未儲存預設規則參數。');}
  else if(act==='rulesReset'){N.rules=defRules();fill();update();say('已還原規則原值。');}}
function init(){layout();var d=lsGet('latoNation.draft');N=d?merge(newNation(),d):newNation();if(!d){var r=lsGet('latoNation.rules');if(r)N.rules=merge(defRules(),r);}if(!N.id)N.id=newId();
  REG=(lsGet('latoNation.reg')||[]).filter(function(x){return x&&x.N;}).map(function(x){return {id:x.id,N:merge(newNation(),x.N)};});
  root.addEventListener('input',onEdit);root.addEventListener('change',onEdit);root.addEventListener('click',onClick);
  renderLists();fill();update();if(d)say('已載入此瀏覽器暫存的草稿。');}
init();
})();
</script>
</body></html>
