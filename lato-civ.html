<style>
/* ===== LatoTools 共用樣式（MediaWiki:Gadget-LatoTools.css 已有，不必重貼） ===== */
.lato-tool{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px;color:#222;}
.lato-tool .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px;color:#555;margin:0 0 10px;}
.lato-tool input[type=number]{width:74px;}
.lato-tool input[type=color]{width:34px;height:26px;padding:0;border:1px solid #ccc;border-radius:4px;vertical-align:middle;}
.lato-tool input[type=range]{width:90px;vertical-align:middle;}
.lato-tool button{padding:4px 12px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;cursor:pointer;font-size:13px;}

.lato-tool .lt-err{color:#b3261e;font-size:13px;margin:0 0 8px;min-height:1em;}

.lato-tool .lt-chip{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;vertical-align:middle;margin-left:4px;}
.lato-tool .lt-cl{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:12px;}
.lato-tool .lt-mk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #b3261e;border-radius:50%;pointer-events:none;display:none;}
.lt-terrain .lt-scroll{max-height:260px;overflow:auto;margin:4px 0;}
.lt-terrain .lt-scroll input[type=number]{padding:1px 3px;font-size:12px;}

.lt-civ .lt-cvp{position:relative;width:100%;background:#cfdde8;border:1px solid #bbb;border-radius:8px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;margin:6px 0;}

/* cluster of connected provinces of the same owner around p satisfying f */

S.cluster=cluster;
/* ---------- unrest: taxes, foreign rulers and faiths, distance from the capital, war, devastation, inflation, instability ---------- */
function unrestYear(){for(var p=0;p<NP;p++){var o=S.owner[p];if(!o){S.unrest[p]*=0.9;continue;}var st=S.states[o],av=st.values.assim||0,fv=st.values.faith||0;

function rebellions(){var r=rng('rebel'),mx=new Float32Array(S.states.length),at=new Int32Array(S.states.length).fill(-1),p;

function politicsYear(){var r=rng('pol');aliveStates().forEach(function(st){var g=GOV[st.gov]||GOV.tribe,b=g[3],tg=new Float32Array(8),i,sum=0,trade=Math.min(1,(st.income>0?0.3:0)+st.urbShare*2);

/* ---------- rulers: death, succession, crises ---------- */
function succession(){var r=rng('succ');aliveStates().forEach(function(st){if(st.kind==='rebel')return;var ru=st.ruler,elect=st.gov==='republic'||st.gov==='merchant'||st.gov==='constitutional'||st.gov==='socialist';

    var pd=st.era>=5?0.008+Math.max(0,ru.age-60)*0.006:0.012+Math.max(0,ru.age-45)*0.005;if(r()>pd)return;
    var crisis=r()<0.12*(1-st.legit)*(st.gov==='feudal'||st.gov==='tribe'||st.gov==='khanate'||st.gov==='chiefdom'?1.6:1)*(1-0.4*(st.techs[TI.bureau]||0))*PV.vol&&st.nprov>=6;

    var ns=splitOff(st,c0,{kind:'rebel',gov:st.gov,base:st.base,prefix:DIRN[dirOf(st.capP,c0[0])].slice(-1),legit:0.45});if(!ns)return;ns.goal='succession';ns.rebelOf=st.id;ns.dyn=st.dyn;

/* ---------- coups and revolutions ---------- */

function govEvolve(){var r=rng('gov');aliveStates().forEach(function(st){if(st.kind==='rebel'||r()>0.08)return;var g=st.gov,T=st.techs,to=null,why='';

    '<b>結果</b><span>'+esc(resText(W))+(W.res&&W.res.terms.length?'；'+esc(W.res.terms.join('；')):'')+'</span><b>涉及人數</b><span>雙方共動員 '+n0(R.sides[0].raised+R.sides[1].raised)+' 人（最高同時在役 '+n0(R.sides[0].peak)+' 對 '+n0(R.sides[1].peak)+'），戰區平民約 '+fmt1(R.pop)+' 人</span>'+
    '<b>總死亡</b><span>'+n0(R.deaths)+' 人（軍人 '+n0(R.sides[0].mil.deaths+R.sides[1].mil.deaths)+'、平民 '+n0(R.sides[0].civ.deaths+R.sides[1].civ.deaths)+'）</span><b>雙方共耗費</b><span>'+n0(R.cost)+' 東銀圓（軍費）；另造成財產損失約 '+n0(R.sides[0].cost.damage+R.sides[1].cost.damage)+' 東銀圓</span></div>';
  /* forces */
  var head='<tr><th class="l">項目</th><th>'+esc(W.kind==='civil'?'起事方':'攻方')+'</th><th>'+esc(W.kind==='civil'?'政府方':'守方')+'</th><th>合計</th></tr>';
  function row(lb,a,b,f){f=f||n0;return '<tr><td class="l">'+lb+'</td><td>'+f(a)+'</td><td>'+f(b)+'</td><td>'+f(a+b)+'</td></tr>';}
  var m0=R.sides[0].mil,m1=R.sides[1].mil,c0=R.sides[0].civ,c1=R.sides[1].civ;
  h+='<h4>兵力</h4><div class="lt-sc"><table class="lt-dt">'+head+row('動員總數（含補充兵）',R.sides[0].raised,R.sides[1].raised)+row('最高同時在役',R.sides[0].peak,R.sides[1].peak)+row('戰役勝場',R.sides[0].won,R.sides[1].won)+'</table></div>';
  h+='<h4>軍人傷亡</h4><div class="lt-sc"><table class="lt-dt">'+head+row('陣亡',m0.kia,m1.kia)+row('傷重不治',m0.dow,m1.dow)+row('病亡與非戰鬥死亡',m0.dis,m1.dis)+'<tr class="sum"><td class="l">死亡合計</td><td>'+n0(m0.deaths)+'</td><td>'+n0(m1.deaths)+'</td><td>'+n0(m0.deaths+m1.deaths)+'</td></tr>'+
    row('重傷（含傷重不治者）',m0.sw,m1.sw)+row('輕傷（多數歸隊）',m0.lw,m1.lw)+row('失蹤（含逃兵）',m0.mia,m1.mia)+row('其中逃兵',m0.des,m1.des)+row('被俘',m0.pow,m1.pow)+'</table></div>';
  h+='<h4>平民傷亡（依受害地區所屬一方計）</h4><div class="lt-sc"><table class="lt-dt">'+head+row('死亡（戰鬥、圍城、屠城）',c0.kia,c1.kia)+row('戰禍饑荒死亡',c0.fam,c1.fam)+row('戰區疫病死亡',c0.dis,c1.dis)+'<tr class="sum"><td class="l">平民死亡合計</td><td>'+n0(c0.deaths)+'</td><td>'+n0(c1.deaths)+'</td><td>'+n0(c0.deaths+c1.deaths)+'</td></tr>'+
    row('重傷',c0.sw,c1.sw)+row('輕傷',c0.lw,c1.lw)+row('失蹤',c0.mia,c1.mia)+row('被擄（軍隊擄走的平民）',c0.abd,c1.abd)+row('難民',c0.ref,c1.ref)+(c0.rep+c1.rep?row('戰後清算處死',c0.rep,c1.rep):'')+'</table></div>';
  /* phases */
  h+='<h4>各時期狀態</h4><div class="lt-sc"><table class="lt-dt"><tr><th>階段</th><th class="l">期間</th><th>時長</th><th class="l">'+(W.kind==='civil'?'起事方':'攻方')+'</th><th class="l">'+(W.kind==='civil'?'政府方':'守方')+'</th><th>戰役（勝／勝）</th><th>兵力（期初→期末）</th><th>軍人死亡</th><th>軍人傷俘失蹤</th><th>平民死亡</th><th>占領地區</th></tr>'+
    W.phases.map(function(p){var t1=p.t1||W.t1||W.tNow,ae=p.armyEnd||[sd[0].army,sd[1].army],oe=p.occEnd||[0,0],d0=p.mil[0][0]+p.mil[0][5]+p.mil[0][6],d1=p.mil[1][0]+p.mil[1][5]+p.mil[1][6],w0=p.mil[0][1]+p.mil[0][2]+p.mil[0][3]+p.mil[0][4],w1=p.mil[1][1]+p.mil[1][2]+p.mil[1][3]+p.mil[1][4];
      return '<tr><td>第 '+p.i+' 階段</td><td class="l">'+dTxt(p.t0)+' – '+dTxt(t1)+'</td><td>'+durTxt(t1-p.t0)+'</td><td class="l">'+WSTAT[p.st[0]]+'</td><td class="l">'+WSTAT[p.st[1]]+'</td><td>'+p.won[0]+'／'+p.won[1]+'</td><td>'+fmt1(p.armyStart[0])+'→'+fmt1(ae[0])+'／'+fmt1(p.armyStart[1])+'→'+fmt1(ae[1])+'</td>'+
        '<td>'+fmt1(d0)+'／'+fmt1(d1)+'</td><td>'+fmt1(w0)+'／'+fmt1(w1)+'</td><td>'+fmt1(p.civD[0])+'／'+fmt1(p.civD[1])+'</td><td>'+oe[0]+'／'+oe[1]+'</td></tr>';}).join('')+'</table></div>';
  /* battles */
  if(W.battles.length)h+='<h4>主要戰役（'+W.battles.length+' 場'+(W.minor.n?'；另有小型衝突 '+W.minor.n+' 次，雙方損失 '+fmt1(W.minor.cas[0])+'／'+fmt1(W.minor.cas[1]):'')+'）</h4><div class="lt-sc"><table class="lt-dt"><tr><th class="l">日期</th><th class="l">戰役</th><th class="l">類型</th><th class="l">攻擊方</th><th>兵力（攻／守）</th><th class="l">勝方</th><th>損失（攻／守）</th><th>平民死亡</th><th>平民傷</th><th>平民失蹤</th><th>被擄</th><th class="l">指揮</th><th class="l">備註</th></tr>'+
    W.battles.map(function(b){return '<tr><td class="l">'+b.y+'.'+b.m+'.'+b.d+'</td><td class="l">'+esc(b.name)+'</td><td class="l">'+(BK[b.kind]||b.kind)+'</td><td class="l">'+(b.att===0?'攻方':'守方')+'</td><td>'+n0(b.n[0])+'／'+n0(b.n[1])+'</td><td class="l">'+(b.win===0?(W.kind==='civil'?'起事方':'攻方'):(W.kind==='civil'?'政府方':'守方'))+'</td>'+
      '<td>'+n0(b.loss[0])+'／'+n0(b.loss[1])+'</td><td>'+n0(b.civ.kia)+'</td><td>'+n0(b.civ.sw+b.civ.lw)+'</td><td>'+n0(b.civ.mia)+'</td><td>'+n0(b.civ.abd)+'</td><td class="l">'+esc(b.cmd[b.att]+' 對 '+b.cmd[1-b.att])+'</td><td class="l">'+esc(b.note)+'</td></tr>';}).join('')+'</table></div>';
  /* materiel */
  var units={};[0,1].forEach(function(k){Object.keys(sd[k].wpn).forEach(function(u){units[u]=1;});Object.keys(sd[k].wpnLost).forEach(function(u){units[u]=1;});});
  h+='<h4>物資消耗</h4><div class="lt-sc"><table class="lt-dt">'+head+
    Object.keys(units).map(function(u){var nm=WPN[u]?WPN[u][0]:u,cr=CREW[u]?'（每 '+CREW[u]+' 人操作）':'';return row(esc(nm)+cr+' 購置',sd[0].wpn[u]||0,sd[1].wpn[u]||0)+row(esc(nm)+' 損失',sd[0].wpnLost[u]||0,sd[1].wpnLost[u]||0);}).join('')+
    Object.keys(AMMO).filter(function(u){return sd[0].ammo[u]||sd[1].ammo[u];}).map(function(u){return row(esc(AMMO[u][0])+' 消耗',sd[0].ammo[u]||0,sd[1].ammo[u]||0);}).join('')+
    row('糧食',sd[0].food,sd[1].food,tons)+row('飲水',sd[0].water,sd[1].water,function(v){return fmt1(v/1000)+' 公噸';})+row('草料',sd[0].fodder,sd[1].fodder,tons)+row('馬匹 購置',sd[0].horses,sd[1].horses)+row('馬匹 損失',sd[0].horsesLost,sd[1].horsesLost)+
    (sd[0].ships||sd[1].ships?row('船艦 動用',sd[0].ships,sd[1].ships)+row('船艦 損失',sd[0].shipsLost,sd[1].shipsLost):'')+'</table></div>';
  /* money */
  var cs=[0,1].map(function(k){return R.sides[k].cost;}),tot=[R.sides[0].total,R.sides[1].total];
  h+='<h4>花費（東銀圓，不變幣值）</h4><div class="lt-sc"><table class="lt-dt">'+head+COSTN.map(function(c){return row(c[1],cs[0][c[0]]||0,cs[1][c[0]]||0);}).join('')+
    '<tr class="sum"><td class="l">軍費合計</td><td>'+n0(cs[0].pay+cs[0].food+cs[0].water+cs[0].fodder+cs[0].equip+cs[0].wpn+cs[0].ammo+cs[0].horse+cs[0].ship+cs[0].siege+cs[0].transport)+'</td><td>'+n0(cs[1].pay+cs[1].food+cs[1].water+cs[1].fodder+cs[1].equip+cs[1].wpn+cs[1].ammo+cs[1].horse+cs[1].ship+cs[1].siege+cs[1].transport)+'</td><td>'+n0(R.cost+cs[0].aidIn+cs[1].aidIn)+'</td></tr>'+
    (cs[0].aidIn||cs[1].aidIn?row('其中外國援助',cs[0].aidIn,cs[1].aidIn):'')+row('戰爭賠款（付出為正）',cs[0].rep,cs[1].rep)+row('掠奪所得',cs[0].loot,cs[1].loot)+row('財產損失（被焚掠與破壞）',cs[0].damage,cs[1].damage)+
    '<tr class="sum"><td class="l">總經濟代價（軍費＋賠款＋損失－掠奪）</td><td>'+n0(tot[0]+cs[0].aidIn+cs[0].rep+cs[0].damage-cs[0].loot)+'</td><td>'+n0(tot[1]+cs[1].aidIn+cs[1].rep+cs[1].damage-cs[1].loot)+'</td><td>'+n0(tot[0]+tot[1]+cs[0].aidIn+cs[1].aidIn+cs[0].damage+cs[1].damage-cs[0].loot-cs[1].loot)+'</td></tr></table></div>';
  h+='<div class="lt-note">以當時本國貨幣計的軍費：'+[0,1].map(function(k){var rc=R.sides[k],own=rc.total;return (k?'守方':'攻方')+' '+esc(rc.cur)+' '+n0(rc.costCur)+'（平均 1 '+esc(rc.cur)+' ≈ '+(rc.costCur>0?(own/rc.costCur).toPrecision(3):'—')+' 東銀圓）';}).join('；')+'。軍餉、糧價與裝備價格依時代設定；飲水以運補成本計。</div>';
  /* chronology */
  if(W.events.length)h+='<h4>戰事紀要</h4><div class="lt-chr" style="max-height:260px">'+W.events.map(function(e){return '<div><span class="y">'+dTxt(e[0])+'</span>'+esc(e[1])+'</div>';}).join('')+'</div>';
  return h;}
/* ---------- a standalone report document ---------- */
function reportDoc(L){var css='body{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:16px;color:#222;max-width:1200px;}h3{color:#3E2723;margin:20px 0 6px;}h4{color:#4E342E;border-left:4px solid #8D6E63;padding-left:6px;margin:12px 0 4px;}'+
    '.lt-kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px;}.lt-kv b{color:#6D4C41;}table{border-collapse:collapse;font-size:12.5px;}th,td{border-bottom:1px solid #eee;padding:3px 7px;text-align:right;white-space:nowrap;}th{background:#f3eee9;color:#4E342E;}.l{text-align:left;}tr.sum td{font-weight:600;border-top:1px solid #bbb;}'+
    '.lt-sc{overflow:auto;}.lt-note{font-size:12px;color:#777;}.lt-chr div{font-size:13px;border-bottom:1px dotted #eee;}.y{display:inline-block;min-width:9em;color:#6D4C41;}';
  return '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>戰報</title><style>'+css+'</style></head><body><h2>動態文明模擬・衝突與戰報</h2><p class="lt-note">世界 '+esc(CS.WD.P0.seed||'')+'；推演 '+CS.S.y0+'–'+CS.S.y+' 年；種子 '+esc(CS.S.SET.par.seed)+'</p>'+L.map(function(W){return warReportHTML(W,false);}).join('<hr>')+'</body></html>';}
function reportTxt(W){var R=W.rep,s='【'+W.name+'】'+W.y0+'–'+(W.active?'持續中':W.y1)+'；'+ERAS[W.era]+'；'+KINDN[W.kind]+'（'+W.cb+'）\n攻方：'+sideNames(W,0)+'\n守方：'+sideNames(W,1)+'\n結果：'+resText(W)+(W.res?'；'+W.res.terms.join('；'):'')+'\n';
  s+='時長：'+durTxt(R.days)+'；地點：'+R.places.join('、')+'；範圍：'+R.provs+' 個地區、約 '+fmt(R.area)+' 平方公里\n';
  [0,1].forEach(function(k){var x=R.sides[k];s+=(k?'守方':'攻方')+'：動員 '+fmt(x.raised)+'；軍人死亡 '+fmt(x.mil.deaths)+'（陣亡 '+fmt(x.mil.kia)+'、傷重不治 '+fmt(x.mil.dow)+'、病亡 '+fmt(x.mil.dis)+'）、重傷 '+fmt(x.mil.sw)+'、輕傷 '+fmt(x.mil.lw)+'、失蹤 '+fmt(x.mil.mia)+'、被俘 '+fmt(x.mil.pow)+
    '；平民死亡 '+fmt(x.civ.deaths)+'、重傷 '+fmt(x.civ.sw)+'、輕傷 '+fmt(x.civ.lw)+'、失蹤 '+fmt(x.civ.mia)+'、被擄 '+fmt(x.civ.abd)+'、難民 '+fmt(x.civ.ref)+'；軍費 '+fmt(x.total)+' 東銀圓（'+x.cur+' '+fmt(x.costCur)+'）\n';});return s;}
/* ---------- exports ---------- */
function renderExp(){var P=pane('exp');P.innerHTML='<div class="row"><button type="button" data-k="xJson">匯出模擬結果（JSON）</button><button type="button" data-k="xChr">匯出編年史（TXT）</button><button type="button" data-k="xWar">匯出最重要的 20 場衝突戰報（HTML）</button><button type="button" data-k="xWarT">匯出全部戰報摘要（TXT）</button>'+
    '<button type="button" data-k="xPng">匯出目前地圖（PNG）</button><button type="button" data-k="xIn">匯出動態文明資料（JSON）</button></div><div class="lt-note">模擬結果檔包含國家、民族、宗教、城鎮與廢墟、商路、戰爭（含戰報）、事件、編年史與最終版圖；在同一個瀏覽器以相同的地圖參數檔、動態文明資料與種子重新模擬，可得到完全相同的歷史。</div>';
  q('xJson').onclick=function(){dl('lato-civ-result.json',new Blob([JSON.stringify(resultJSON())],{type:'application/json'}));};
  q('xChr').onclick=function(){var S=CS.S;dl('lato-civ-chronicle.txt',new Blob([S.chron.map(function(e){return e.y+' 年'+(e.m?e.m+' 月':'')+'【'+e.cat+'】'+e.t;}).join('\n')],{type:'text/plain'}));};
  q('xWar').onclick=function(){dl('lato-civ-wars.html',new Blob([reportDoc(warRows().slice(0,20))],{type:'text/html'}));};
  q('xWarT').onclick=function(){dl('lato-civ-wars.txt',new Blob([warRows().map(reportTxt).join('\n')],{type:'text/plain'}));};
  q('xPng').onclick=function(){var c=mk(CS.W,CS.H),z=CS.z,vx=CS.vx,vy=CS.vy;CS.z=1;CS.vx=0;CS.vy=0;render(c,false);CS.z=z;CS.vx=vx;CS.vy=vy;c.toBlob(function(b){dl('lato-civ-'+CS.S.snaps[CS.si].y+'.png',b);});};
  q('xIn').onclick=function(){q('cExp').click();};}
function resultJSON(){var S=CS.S,A=CS.WD.A,last=S.snaps[S.snaps.length-1];
  return {format:'LatoCivResult',v:1,map:{seed:CS.WD.P0.seed,W0:CS.WD.P0.W0,H0:CS.WD.P0.H0,provinces:CS.WD.NP},settings:S.SET,y0:S.y0,y1:S.y,deaths:S.stat.deaths,stages:S.wstHist,
    states:S.states.slice(1).map(function(s){return {id:s.id,name:s.name,base:s.base,kind:s.kind,gov:s.gov,founded:s.founded,ended:s.ended||null,endWhy:s.endWhy||'',endBy:s.endBy||0,parent:s.parent,nameHist:s.nameHist,govHist:s.govHist,culture:(S.cultures[s.cult]||{}).name,religion:(S.religions[s.relig]||{}).name,race:s.race,traits:s.traits,values:s.values,color:s.color,colonies:s.colonies||0,currency:s.cur.name,currencyHistory:s.curHist||[]};}),
    cultures:S.cultures.slice(1).map(function(c){return {id:c.id,name:c.name,naming:c.naming,race:c.race,founded:c.founded,parents:c.parents,fused:!!c.fused,native:!!c.native};}),religions:S.religions.slice(1).map(function(r){return {id:r.id,name:r.name,founded:r.founded,parent:r.parent,folk:r.folk};}),
    towns:S.towns.map(function(t){var ll=[A.lon[t.p],A.lat[t.p]];return {id:t.id,name:t.name,x:t.x,y:t.y,province:t.p,lon:+ll[0].toFixed(2),lat:+ll[1].toFixed(2),founded:t.founded,pop:Math.round(t.pop),peak:Math.round(t.peak),peakTier:TIER[t.peakTier],functions:S.fnName(t),ruin:t.ruin?{year:t.ruin.y,cause:S.CAUSE[t.ruin.c]}:null,events:t.ev};}),
    routes:S.routes.map(function(r){return {name:r.name,good:r.good,from:S.towns[r.a].name,to:S.towns[r.b].name,km:r.km,days:r.days,value:Math.round(r.v),opened:r.y0,last:r.y1,active:r.active,sea:r.sea};}),
    wars:S.wars.map(function(W){return {id:W.id,name:W.name,kind:KINDN[W.kind],goal:GOALN[W.goal]||W.goal,cause:W.cb,start:[W.y0,W.m0],end:W.active?null:[W.y1,W.m1],era:ERAS[W.era],stage:STAGES[W.stage],sides:[sideNames(W,0),sideNames(W,1)],result:resText(W),terms:W.res?W.res.terms:[],report:W.rep,phases:W.phases,battles:W.battles,events:W.events.map(function(e){return [dTxt(e[0]),e[1]];}),
      materiel:W.sides.map(function(sd){return {weapons:sd.wpn,weaponsLost:sd.wpnLost,ammo:sd.ammo,foodKg:Math.round(sd.food),waterL:Math.round(sd.water),fodderKg:Math.round(sd.fodder),horses:Math.round(sd.horses),horsesLost:Math.round(sd.horsesLost),ships:sd.ships,shipsLost:sd.shipsLost};})};}),
    events:S.evLog,chronicle:S.chron.map(function(e){return {y:e.y,m:e.m,cat:e.cat,imp:e.imp,text:e.t};}),timeline:S.snaps.map(function(s){return {y:s.y,pop:Math.round(s.totPop),urban:Math.round(s.urbPop),states:s.nStates,stage:STAGES[s.wstage],era:ERAS[s.wera]};}),
    final:{year:last.y,owner:Array.from(last.owner),culture:Array.from(last.cult),religion:Array.from(last.relig),pop:Array.from(last.pop,function(v){return Math.round(v);})}};}
})();
</script>
