.lato-tool .lt-chip{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;vertical-align:middle;margin-left:4px;}
.lato-tool .lt-cl{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:12px;}

.lt-wx button:disabled{opacity:.45;cursor:default;}
.lt-wx .lt-vbar{height:3px;background:#e6e6e6;border-radius:2px;overflow:hidden;margin:0 0 8px;}
.lt-wx .lt-vbar>div{height:100%;width:0;background:#555;}

.lt-wx .lt-wvp canvas{display:block;cursor:grab;outline:none;touch-action:none;}

.lt-wx .lt-ov{font-size:13px;line-height:1.7;}
