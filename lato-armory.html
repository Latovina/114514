/* ---------- canvas charts ---------- */
function cvs(c,h){var w=Math.max(280,c.clientWidth||c.parentNode.clientWidth||600),r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;c.style.height=h+'px';var g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);return {g:g,w:w,h:h};}
function niceMax(v){if(!(v>0))return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chart(c,o){/* o: {h, x:[label,max], y:[label,max], series:[{c,pts:[[x,y]],w,dash,fill,label}], hl:[{y,c,label}], vl:[{x,c,label}]} */
  var C=cvs(c,o.h||240),g=C.g,L=54,R=12,T=14,B=34,W=C.w-L-R,H=C.h-T-B,xm=niceMax(o.x[1]),ym=o.y[1]>0?niceMax(o.y[1]):1,ymin=o.y[2]<0?-niceMax(-o.y[2]):(o.y[2]||0);
  function X(x){return L+x/xm*W;}function Y(y){return T+H-(y-ymin)/(ym-ymin)*H;}
  g.font='11px system-ui,sans-serif';g.strokeStyle='#e3e3e3';g.fillStyle='#666';g.lineWidth=1;
  for(var i=0;i<=5;i++){var yv=ymin+(ym-ymin)*i/5,yy=Y(yv);g.beginPath();g.moveTo(L,yy);g.lineTo(L+W,yy);g.stroke();g.textAlign='right';g.fillText(fx(yv,yv<10&&ym<20?1:0),L-5,yy+4);}
  for(i=0;i<=5;i++){var xv=xm*i/5,xx=X(xv);g.beginPath();g.moveTo(xx,T);g.lineTo(xx,T+H);g.stroke();g.textAlign='center';g.fillText(fx(xv,xv<10&&xm<20?1:0),xx,T+H+14);}
  g.fillStyle='#444';g.textAlign='center';g.fillText(o.x[0],L+W/2,C.h-4);g.save();g.translate(12,T+H/2);g.rotate(-PI/2);g.fillText(o.y[0],0,0);g.restore();
  (o.fills||[]).forEach(function(f){g.fillStyle=f.c;g.beginPath();f.top.forEach(function(p,j){var px=X(p[0]),py=Y(p[1]);if(j)g.lineTo(px,py);else g.moveTo(px,py);});for(var j=f.bot.length-1;j>=0;j--)g.lineTo(X(f.bot[j][0]),Y(f.bot[j][1]));g.closePath();g.fill();});
  (o.hl||[]).forEach(function(l){g.strokeStyle=l.c;g.setLineDash([5,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(L,Y(l.y));g.lineTo(L+W,Y(l.y));g.stroke();g.setLineDash([]);g.fillStyle=l.c;g.textAlign='right';g.fillText(l.label||'',L+W-4,Y(l.y)-4);});
  (o.vl||[]).forEach(function(l){g.strokeStyle=l.c;g.setLineDash([3,3]);g.lineWidth=1.2;g.beginPath();g.moveTo(X(l.x),T);g.lineTo(X(l.x),T+H);g.stroke();g.setLineDash([]);g.fillStyle=l.c;g.textAlign='left';g.fillText(l.label||'',X(l.x)+3,T+H-6);});
  (o.series||[]).forEach(function(s){g.strokeStyle=s.c;g.lineWidth=s.w||2;if(s.dash)g.setLineDash(s.dash);g.beginPath();s.pts.forEach(function(p,j){var px=X(p[0]),py=Y(clamp(p[1],ymin,ym));if(j)g.lineTo(px,py);else g.moveTo(px,py);});g.stroke();g.setLineDash([]);});
  var lx=L+8;(o.series||[]).concat(o.hl||[]).forEach(function(s){if(!s.label||s.y!==undefined)return;g.fillStyle=s.c;g.fillRect(lx,T+4,12,3);g.fillStyle='#333';g.textAlign='left';g.fillText(s.label,lx+16,T+9);lx+=g.measureText(s.label).width+34;});
  return {X:X,Y:Y};}
function bars(c,vals,labels,o){var C=cvs(c,o.h||180),g=C.g,L=40,B=26,T=10,W=C.w-L-10,H=C.h-T-B,n=vals.length,bw=W/n*0.7;g.font='11px system-ui,sans-serif';
  for(var i=0;i<=4;i++){var y=T+H-H*i/4;g.strokeStyle='#e6e6e6';g.beginPath();g.moveTo(L,y);g.lineTo(L+W,y);g.stroke();g.fillStyle='#666';g.textAlign='right';g.fillText(Math.round(i*25)+'%',L-4,y+4);}

/* ---------- side-view penetration animation ----------
   The shot travels left to right. Plates are drawn in true line-of-sight thickness and sloped with the struck face leaning back
   from the incoming round ("/"), as a glacis would be. Each material answers with its own effect: sparks, crater, plug and spall
   (metal), powder, radial cracks and fracture cone (ceramic), back-face bulge and frayed fibres (textiles), spider-web cracks and

RENDER.mat={init:function(){var E=pane('mat');E.innerHTML='<div class="lt-info">「魔能素」等架空材料可自由設定物理性質與魔能性質：護盾吸收每發的能量、硬化提高靶材阻抗、偏斜場加大有效傾角、屬性相剋（同屬性強化、受剋屬性削弱）、多發時的容量與再生；破魔彈頭會削減這些效果。全域「魔能充能」整體縮放。</div>'+

RENDER.io={init:function(){var E=pane('io');E.innerHTML='<div class="row"><button type="button" data-k="iExp">匯出自訂彈藥與材料（JSON）</button><button type="button" data-k="iImp">匯入（JSON）</button><input type="file" data-k="iFile" accept=".json,application/json" style="display:none">'+
  '<button type="button" data-k="iCsv">匯出最近一次穿甲結果（CSV）</button><button type="button" data-k="iLib">匯出全部彈藥價格表（CSV）</button><button type="button" data-k="iReset">清除全部自訂</button></div><div class="lt-note" data-k="iMsg"></div>'+
  '<h4>模型與資料說明</h4><div class="lt-info lt-small">'+
  '・長桿穿甲彈：Lanz–Odermatt 貫穿方程（鎢、鋼、貧鈾含自銳係數），多層裝甲以校準後的 Tate–Alekseevskii 侵蝕模型逐層積分，傾角依 cos<sup>0.224</sup> 修正；穿過薄斜板會引起偏航。<br>'+
  '・硬芯彈與鉛心彈：Tate–Alekseevskii（剛體／侵蝕兩種狀態、背面弱化、尺寸效應），彈芯硬度不足或撞上更硬的靶材會碎裂；鈍頭穿薄板時帶走塞塊。<br>'+
  '・陶瓷複合板：Florence 模型（63° 陶瓷錐、背板的破斷應變與強度）；軟甲：Cunniff 量綱分析 V50＝U*<sup>1/3</sup>·f(面密度×投影面積／彈重)，含彈頭在織物上的變形。<br>'+
  '・聚能裝藥：穿深＝裝藥直徑×係數×炸高曲線×藥型罩，靶材依密度平方根與強度換算；反應裝甲依傾角削弱射流與長桿，串聯裝藥可先行引爆。碎甲彈依裝藥量估算背面剝落厚度。<br>'+
  '・背面變形：以 Roma Plastilina 黏土的落球校準值（1.04 kg、2 m → 25 mm）反推；NIJ 上限 44 mm。<br>'+
  '・凝膠：速度平方阻力加強度項、彈頭偏航至翻滾、擴張與碎裂；暫時腔直徑由單位長度能量釋放換算；失能機率僅為以永久腔體積估計的指標。<br>'+
  '・爆炸：Kinney–Graham 超壓公式；破片：Gurney 初速、Mott 質量分布、79 J 危險破片判準。<br>'+
  '・造價：原料價×加工倍率＋彈殼、發射藥、炸藥、引信與導引、裝配，乘以製造複雜度（內建彈藥已校準到公開合約價量級）、批量學習曲線（90%）與市場係數；1 東銀圓預設等於 2.5 美元。<br>'+
  '・校準資料：NIJ 0101.06／0101.07 測試彈、常見 III／IV 級插板、.30-06 M2、.50 M2、14.5 B-32 對均質鋼、DM53／M829／3BM42 的公開穿深、PG-7VL／標槍、FBI 凝膠測試等。結果為工程估算，同一彈種實際仍有約 ±10–20% 的離散。</div>';
  q('iExp').onclick=function(){dl('lato-armory-library.json',new Blob([JSON.stringify({format:'LatoArmory',v:1,set:S.set,mats:S.mats.filter(function(m){return m._u;}),proj:S.proj.filter(function(p){return p._u;})},null,1)],{type:'application/json'}));};
  q('iImp').onclick=function(){q('iFile').click();};
  q('iFile').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);(d.mats||[]).forEach(function(m){m._u=1;var i=idxOf(S.mats,m.id);if(i>=0)S.mats[i]=m;else S.mats.push(m);});
      (d.proj||[]).forEach(function(p){p._u=1;var i=idxOf(S.proj,p.id);if(i>=0)S.proj[i]=p;else S.proj.push(p);});q('iMsg').textContent='已匯入 '+(d.mats||[]).length+' 種材料、'+(d.proj||[]).length+' 種彈藥。';libChanged();}catch(e){err(e);}};rd.readAsText(f);};
  q('iCsv').onclick=function(){var x=S.last;if(!x){q('iMsg').textContent='請先在「穿甲模擬」計算一次。';return;}var rows=[['層','材料','厚度mm','傾角','視線厚mm','入射速度','侵徹深mm','結果']];
    x.r.layers.forEach(function(l){rows.push([l.i+1,l.mat.n,l.t,l.ang,fx(l.los,1),fx(l.vIn,0),l.dop!==undefined?fx(l.dop,1):'',l.res||'']);});rows.unshift(['彈藥',x.p.n,'撞擊速度',fx(x.v,0)]);
    dl('lato-armory-result.csv',new Blob(['﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n')],{type:'text/csv'}));};
  q('iLib').onclick=function(){var rows=[['彈藥','類別','彈頭g','全彈g','每30顆kg','單價東銀圓','每30顆東銀圓','初速m/s']];S.proj.forEach(function(p){var c=costP(p).usd/S.set.rate,rm=A.roundMass(p),sm=small(p);rows.push([p.n,(A.GROUPS[p.g]||[''])[0],p.m,fx(rm,1),sm?fx(rm*30/1000,3):'',fx(c,2),sm?fx(c*30,2):'',p.v0]);});
    dl('lato-armory-prices.csv',new Blob(['﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n')],{type:'text/csv'}));};
  q('iReset').onclick=function(){if(!confirm('清除所有自訂的彈藥、材料與設定？'))return;store(KEY,{});loadLib();libChanged();q('iMsg').textContent='已還原為內建資料。';};},
 run:function(){}};
