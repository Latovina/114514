<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>城市與國土規劃（LatoCity）</title>
<style>
/* ===== LatoCity 新增：以下附加到 MediaWiki:Gadget-LatoTools.css 末尾
   版面沿用作戰模擬（LatoWarsim）的全螢幕地圖頁：深色頂列、左側功能欄、地圖鋪滿、浮動面板 ===== */
#lato-city{--rail:64px;--barh:44px;--ink:#1f2328;--navy:#1f2a36;--navy2:#26364a;--paper:#f3f2ee;--line:#d6d3cb;--accent:#7cb6ff;
  position:relative;height:100vh;height:100dvh;overflow:hidden;background:#1b232c;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px;color:var(--ink);line-height:1.5;}
#lato-city *{box-sizing:border-box;}
#lato-city [hidden]{display:none!important;}
#lato-city button,#lato-city select,#lato-city input{font:inherit;}
.lc-bar{position:absolute;left:0;right:0;top:0;height:var(--barh);display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#223142,#19242f);border-bottom:1px solid #0d141b;box-shadow:0 2px 10px rgba(0,0,0,.3);color:#e8edf2;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;z-index:30;white-space:nowrap;}
.lc-bar::-webkit-scrollbar{display:none;}
.lc-bar>*{flex:none;}
.lc-bar .lc-sp{flex:1 1 0;min-width:4px;}
.lc-bar .lc-ttl{font-weight:700;font-size:15px;letter-spacing:.5px;max-width:16ch;overflow:hidden;text-overflow:ellipsis;}
.lc-clock{font-variant-numeric:tabular-nums;font-size:13px;color:#fff;}
.lc-tc{display:flex;align-items:center;gap:2px;}
.lc-tc button{border:1px solid #3d4c5c;background:#2a3846;color:#e8edf2;border-radius:5px;padding:2px 7px;font-size:12px;cursor:pointer;min-height:28px;}
.lc-tc button.on{background:#e8edf2;color:var(--navy);border-color:#e8edf2;font-weight:700;}
.lc-tc button:hover{border-color:#8fa3b8;}
.lc-kpi{display:flex;gap:4px;}
.lc-kpi span{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#2a3846;border:1px solid #3d4c5c;border-radius:12px;padding:1px 9px;font-variant-numeric:tabular-nums;color:#dfe7ef;cursor:default;}
.lc-kpi span b{font-weight:600;color:#fff;}
.lc-kpi span.bad{border-color:#c0574f;color:#ffd7d3;}
.lc-kpi span.warn{border-color:#c79a3a;color:#ffe9bd;}
.lc-tabs{position:absolute;left:0;top:var(--barh);bottom:0;width:var(--rail);display:flex;flex-direction:column;gap:2px;padding:6px 0;background:#17202a;border-right:1px solid #0d141b;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:25;}
.lc-tabs::-webkit-scrollbar{display:none;}
.lc-tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;font-size:10.5px;line-height:1.15;color:#a9b6c3;background:none;border:0;border-left:3px solid transparent;cursor:pointer;flex:none;}
.lc-tabs button i{font-style:normal;font-size:19px;line-height:1;}
.lc-tabs button:hover{background:#202c38;color:#fff;}
.lc-tabs button.on{color:#fff;background:var(--navy2);border-left-color:var(--accent);font-weight:600;}
.lc-tabs button:focus-visible,.lc-btn:focus-visible,.lc-zb button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.lc-body{position:absolute;left:var(--rail);right:0;top:var(--barh);bottom:0;overflow:hidden;background:#2d3a46;}
.lc-mapw{position:absolute;inset:0;touch-action:none;}
.lc-mapw canvas.lc-cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;}
.lc-mapw canvas.lc-cv.drag{cursor:grabbing;}
.lc-mapw canvas.lc-cv.tool{cursor:crosshair;}
/* 浮動面板 */
.lc-pane{position:absolute;top:10px;bottom:10px;z-index:8;width:300px;background:rgba(255,255,255,.96);border:1px solid rgba(20,30,40,.18);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.3);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.lc-pane.l{left:10px;}
.lc-pane.r{right:10px;width:340px;}
.lc-pane>.lc-ph{background:rgba(250,250,248,.95);border-bottom:1px solid #e3e0d8;padding:7px 10px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;flex:none;}
.lc-pane>.lc-ph .lc-x{margin-left:auto;border:0;background:none;cursor:pointer;color:#666;font-size:15px;padding:0 4px;}
.lc-pane>.lc-pb{padding:8px 10px 12px;font-size:13px;overflow:auto;flex:1;min-height:0;}
.lc-ptg{position:absolute;top:50%;transform:translateY(-50%);z-index:9;border:1px solid rgba(20,30,40,.25);background:rgba(255,255,255,.93);color:var(--navy);font-size:12px;line-height:1.2;padding:12px 5px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.lc-ptg.l{left:0;border-left:0;border-radius:0 8px 8px 0;}
.lc-ptg.r{right:0;border-right:0;border-radius:8px 0 0 8px;}
.lc-ly{position:absolute;top:8px;z-index:6;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;left:calc(var(--padl,0px) + 10px);right:calc(var(--padr,0px) + 10px);pointer-events:none;}
.lc-ly label,.lc-ly select{pointer-events:auto;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.25);border-radius:5px;padding:1px 6px;font-size:11px;display:inline-flex;align-items:center;gap:3px;cursor:pointer;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.18);}
.lc-ly select{padding:1px 2px;}
.lc-zb{position:absolute;right:calc(var(--padr,0px) + 10px);bottom:40px;z-index:6;display:flex;flex-direction:column;gap:4px;}
.lc-zb button{width:32px;height:32px;border-radius:6px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.92);cursor:pointer;font-size:15px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.lc-mode{position:absolute;left:calc(var(--padl,0px) + (100% - var(--padl,0px) - var(--padr,0px)) / 2);bottom:10px;transform:translateX(-50%);z-index:7;background:rgba(31,42,54,.94);color:#fff;font-size:12px;padding:4px 6px 4px 12px;border-radius:14px;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;}
.lc-mode button{background:#fff;color:var(--navy);border:0;border-radius:10px;padding:1px 9px;cursor:pointer;font-size:12px;}
.lc-mode button.pri{background:var(--accent);}
.lc-tip{position:absolute;z-index:12;pointer-events:none;background:rgba(20,26,33,.93);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;max-width:300px;line-height:1.45;white-space:pre-line;}
/* 角落的層級導覽：國家 › 省 › 縣市 › 鄉鎮 */
.lc-where{position:absolute;left:calc(var(--padl,0px) + 10px);bottom:10px;z-index:7;background:rgba(23,32,42,.92);color:#e8edf2;border-radius:10px;padding:7px 9px 8px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:12px;min-width:200px;max-width:min(330px,calc(100% - var(--padl,0px) - var(--padr,0px) - 70px));}
.lc-where .lc-lvl{display:flex;align-items:center;gap:6px;color:#9fb0c2;font-size:11px;margin-bottom:3px;}
.lc-where .lc-lvl b{color:#fff;font-weight:600;}
.lc-where .lc-lvl .lc-sb{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums;}
.lc-where .lc-lvl .lc-sb i{display:block;height:4px;border:1px solid #cfd8e2;border-top:0;}
.lc-crumb{display:flex;flex-direction:column;gap:1px;}
.lc-crumb button{display:flex;align-items:baseline;gap:6px;text-align:left;background:none;border:0;color:#e8edf2;padding:2px 4px;border-radius:5px;cursor:pointer;font-size:12.5px;}
.lc-crumb button:hover{background:rgba(255,255,255,.1);}
.lc-crumb button small{color:#8fa3b8;font-size:10.5px;min-width:3.2em;}
.lc-crumb button.cur{background:rgba(124,182,255,.18);}
.lc-crumb button .lc-ind{color:#5c6f83;}
.lc-mini{display:block;margin-top:6px;border-radius:6px;cursor:pointer;width:100%;height:auto;border:1px solid #33475c;}
.lc-where.min .lc-mini,.lc-where.min .lc-crumb button:not(.cur){display:none;}
.lc-where .lc-wt{position:absolute;right:6px;top:4px;border:0;background:none;color:#8fa3b8;cursor:pointer;font-size:11px;}
/* 面板內容 */
.lc-h{font-size:12px;font-weight:700;color:#41505f;margin:12px 0 5px;letter-spacing:.3px;}
.lc-h:first-child{margin-top:2px;}
.lc-note{font-size:12px;color:#666;margin:4px 0;}
.lc-warn{font-size:12px;color:#8a4b00;background:#fff4e0;border:1px solid #f0d9ae;border-radius:6px;padding:4px 8px;margin:4px 0;}
.lc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0;font-size:13px;}
.lc-row label{display:inline-flex;align-items:center;gap:4px;}
.lc-btn{padding:4px 11px;border:1px solid #9a9a9a;border-radius:6px;background:#fff;color:#222;cursor:pointer;font-size:12.5px;min-height:30px;}
.lc-btn:hover{background:#f2f2f0;}
.lc-btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;}
.lc-btn.pri:hover{background:#2e3e50;}
.lc-btn.dng{color:#b3261e;border-color:#d99;}
.lc-btn.sm{padding:2px 8px;font-size:12px;min-height:26px;}
.lc-btn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.lc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;}
.lc-grid.g2{grid-template-columns:repeat(2,1fr);}
.lc-grid.g4{grid-template-columns:repeat(4,1fr);}
.lc-grid button{display:flex;align-items:center;gap:5px;padding:4px 6px;border:1px solid #c8c4ba;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;min-height:32px;text-align:left;line-height:1.2;}
.lc-grid button.on{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:#eef3f9;font-weight:600;}
.lc-grid button:hover{border-color:#8899aa;}
.lc-sw{display:inline-block;width:13px;height:13px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25);}
.lc-kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:12.5px;}
.lc-kv>span:nth-child(odd){color:#666;white-space:nowrap;}
.lc-kv>span:nth-child(even){font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere;text-align:right;}
.lc-bars{display:grid;grid-template-columns:5.2em 1fr 4.6em;gap:3px 6px;align-items:center;font-size:12px;margin:4px 0;}
.lc-bars>span:nth-child(3n){text-align:right;font-variant-numeric:tabular-nums;color:#444;}
.lc-b{height:8px;background:#ebe8e1;border-radius:4px;overflow:hidden;position:relative;}
.lc-b>i{position:absolute;top:0;bottom:0;left:0;background:#4c7a9e;border-radius:4px;}
.lc-b.g>i{background:#2e7d32;}.lc-b.y>i{background:#d39a00;}.lc-b.r>i{background:#c62828;}
.lc-b.c::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#9a958a;}
.lc-b.c>i.p{background:#2e7d32;}.lc-b.c>i.n{background:#c62828;}
.lc-tbl{border-collapse:collapse;width:100%;font-size:12px;}
.lc-tbl th{font-weight:600;color:#555;text-align:left;border-bottom:1px solid #ccc;padding:3px 4px;white-space:nowrap;font-size:11.5px;}
.lc-tbl td{border-bottom:1px solid #eee;padding:3px 4px;vertical-align:top;}
.lc-tbl td.n,.lc-tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.lc-tbl tr.cl{cursor:pointer;}.lc-tbl tr.cl:hover td{background:#f5f5f2;}
.lc-sc{overflow-x:auto;max-width:100%;}
.lc-pill{display:inline-block;padding:0 7px;border-radius:9px;font-size:11px;line-height:18px;background:#eceae4;color:#444;white-space:nowrap;}
.lc-pill.g{background:#e3f1e4;color:#1b5e20;}.lc-pill.y{background:#fff1cf;color:#7a5200;}.lc-pill.r{background:#fbe1df;color:#9b1c13;}.lc-pill.b{background:#e1ecf8;color:#0d47a1;}
.lc-ln{display:flex;align-items:center;gap:6px;padding:4px 4px;border-bottom:1px solid #f0eee8;cursor:pointer;font-size:12.5px;border-radius:4px;}
.lc-ln:hover{background:#f4f3ef;}
.lc-ln.on{background:#dce8f6;}
.lc-ln .lc-lc{width:22px;height:6px;border-radius:3px;flex:none;}
.lc-ln .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lc-ln .st{font-size:11px;color:#777;flex:none;font-variant-numeric:tabular-nums;}
.lc-tree{font-size:12.5px;user-select:none;}
.lc-tree .lc-n{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px;cursor:pointer;white-space:nowrap;min-height:24px;}
.lc-tree .lc-n:hover{background:#f1f0ec;}
.lc-tree .lc-n.on{background:#dce8f6;}
.lc-tree .lc-n .tg{width:14px;text-align:center;color:#888;flex:none;}
.lc-tree .lc-n .nm{overflow:hidden;text-overflow:ellipsis;flex:1;}
.lc-tree .lc-n .st{font-size:11px;color:#777;flex:none;font-variant-numeric:tabular-nums;}
.lc-tree .lc-k{padding-left:12px;border-left:1px dotted #ccc;margin-left:7px;}
.lc-ev{border:1px solid #e3e0d8;border-radius:8px;padding:6px 8px;margin:6px 0;background:#fbfaf7;}
.lc-ev b{font-size:12.5px;}
.lc-ev .lc-prog{height:6px;background:#e6e3dc;border-radius:3px;overflow:hidden;margin:5px 0 2px;}
.lc-ev .lc-prog>i{display:block;height:100%;background:#2e7d32;}
.lc-in{width:100%;padding:3px 6px;border:1px solid #bbb;border-radius:5px;font-size:12.5px;}
.lc-opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 8px;align-items:center;font-size:12.5px;margin:6px 0;}
.lc-opt select,.lc-opt input{font-size:12.5px;max-width:100%;}
.lc-chart{width:100%;height:auto;display:block;}
.lc-legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:#555;margin:4px 0;}
.lc-legend span{display:inline-flex;align-items:center;gap:4px;}
.lc-help h4{margin:12px 0 4px;font-size:13px;}
.lc-help p,.lc-help li{font-size:12.5px;line-height:1.65;color:#333;}
.lc-help ul{padding-left:18px;margin:4px 0;}
/* 載入與提示 */
.lc-load{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,22,29,.78);color:#fff;}
.lc-load>div{width:min(360px,86%);text-align:center;font-size:13px;}
.lc-load .lc-pg{height:6px;background:#33475c;border-radius:3px;overflow:hidden;margin-top:10px;}
.lc-load .lc-pg>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s;}
.lc-toasts{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92%;}
.lc-toast{background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
.lc-toast.bad{background:#7d1f18;}
/* 直式手機：功能欄移到下方，面板改為底部抽屜 */
#lato-city.lc-port{--rail:0px;--tabh:56px;}
.lc-port .lc-tabs{top:auto;bottom:0;left:0;right:0;width:auto;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding:0 2px env(safe-area-inset-bottom,0px);flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid #0d141b;}
.lc-port .lc-tabs button{flex:0 0 auto;min-width:58px;padding:5px 4px 3px;border-left:0;border-top:3px solid transparent;}
.lc-port .lc-tabs button.on{border-top-color:var(--accent);}
.lc-port .lc-body{left:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));}
.lc-port .lc-pane,.lc-port .lc-pane.r{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:14px 14px 0 0;}
.lc-port .lc-ptg{top:auto;transform:none;bottom:8px;padding:6px 10px;border-radius:16px!important;border:1px solid rgba(20,30,40,.25)!important;}
.lc-port .lc-ptg.l{left:8px;}.lc-port .lc-ptg.r{right:8px;}
.lc-port .lc-where{bottom:auto;top:44px;left:8px;min-width:0;}
.lc-port .lc-zb{right:8px;bottom:48px;}
.lc-port .lc-ly{left:8px;right:8px;}
.lc-port .lc-bar .lc-kpi span:nth-child(n+3){display:none;}
.lc-lyt{display:none;}
.lc-port .lc-ly .lc-lyt{display:inline-flex;pointer-events:auto;background:var(--navy);color:#fff;border:1px solid rgba(0,0,0,.3);border-radius:5px;font-size:11px;padding:1px 8px;cursor:pointer;}
.lc-port .lc-ly:not(.open)>label{display:none;}
.lc-port .lc-ly{justify-content:flex-start;}
@media (prefers-reduced-motion:reduce){.lc-load .lc-pg>i{transition:none;}}
.lc-port .lc-ly:not(.open)>select[data-c="theme"]{display:none;}
/* 圖表 */
.lc-fig{margin:8px 0 14px;padding:0;}
.lc-fig figcaption{display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px;margin:0 0 4px;}
.lc-fig figcaption b{font-size:12.5px;font-weight:650;color:#0b0b0b;}
.lc-fig figcaption span{font-size:11px;color:#6b6a65;}
.lc-svg{display:block;width:100%;height:auto;overflow:visible;font-family:inherit;}
.lc-svg text{font-size:10.5px;fill:#52514e;}
.lc-svg .ax{font-size:10px;fill:#898781;font-variant-numeric:tabular-nums;}
.lc-svg .lab{font-size:11px;fill:#2b2a27;}
.lc-svg .val{font-size:11px;fill:#0b0b0b;font-weight:600;font-variant-numeric:tabular-nums;}
.lc-svg .seg{font-size:10.5px;font-weight:600;}
.lc-svg .st{font-size:10.5px;font-weight:700;}
.lc-svg .st-good{fill:#006300;}.lc-svg .st-warn{fill:#7a5200;}.lc-svg .st-crit{fill:#b3261e;}
.lc-svg [data-tt]{cursor:default;outline:none;}
.lc-svg [data-tt]:focus-visible>rect:first-child{stroke:#2a78d6;stroke-width:1.5;}
.lc-leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;color:#52514e;margin:4px 0 0;}
.lc-leg span{display:inline-flex;align-items:center;gap:5px;}
.lc-leg .k-line{width:14px;height:3px;border-radius:2px;display:inline-block;}
.lc-leg .k-rect{width:10px;height:10px;border-radius:3px;display:inline-block;}
.lc-leg .k-tick{width:2px;height:12px;display:inline-block;background:#52514e;}
details.lc-tv{margin-top:3px;font-size:11px;}
details.lc-tv summary{cursor:pointer;color:#6b6a65;list-style:none;display:inline-block;padding:1px 0;}
details.lc-tv summary::-webkit-details-marker{display:none;}
details.lc-tv summary::before{content:'▸ ';}
details.lc-tv[open] summary::before{content:'▾ ';}
details.lc-tv .lc-sc{max-height:220px;overflow:auto;margin-top:3px;}
.lc-ctip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid #d6d3cb;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:6px 9px;font-size:12px;color:#1f2328;max-width:260px;line-height:1.45;white-space:pre-line;}
.lc-ctip .tt{font-weight:700;margin-bottom:2px;}
.lc-ctip .tv{font-weight:700;font-variant-numeric:tabular-nums;}
.lc-ctip .tr{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.lc-ctip .tr i{width:10px;height:3px;border-radius:2px;flex:none;}
.lc-ctip .tr b{font-variant-numeric:tabular-nums;}
.lc-ctip .tr span{color:#6b6a65;}
/* 指標卡 */
.lc-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0 10px;}
.lc-tile{border:1px solid #e3e0d8;border-radius:8px;background:#fcfcfb;padding:6px 8px 4px;display:flex;flex-direction:column;min-width:0;}
.lc-tile .l{font-size:11px;color:#6b6a65;}
.lc-tile .v{font-size:17px;font-weight:700;color:#0b0b0b;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-tile .d{font-size:11px;color:#6b6a65;font-variant-numeric:tabular-nums;}
.lc-tile .d.dg{color:#006300;}.lc-tile .d.db{color:#b3261e;}
.lc-spark{display:block;margin-top:2px;max-width:100%;}
.lc-card{border:1px solid #e3e0d8;border-radius:10px;background:#fbfaf7;padding:8px 10px;margin:8px 0;}

LEFT.help=function(){return '<div class="lc-help"><h4>這是什麼</h4><p>一個國土與城市規劃的模擬：從首都到各省、縣市、鄉鎮，規劃土地使用、道路與軌道、港口機場與航線，觀察人口如何因工作、住房、交通、公共服務、環境與災害而移動，並在天災後重建。地圖與作戰模擬（LatoWarsim）使用同一種格網格式，可以互相讀寫。</p>'+
  '<h4>城市怎麼產生</h4><ul><li>每座城鎮先判斷地理（臨海、沿河、山谷、周圍農地）、礦產、與首都的距離和聯外方向，決定角色：港口城市、工業城市、礦業城鎮、農業市鎮、衛星市鎮、大學城、觀光城鎮、漁港、山城或區域中心。</li><li>街道型態依開發程度與地形：大城市棋盤式或放射環狀，山城沿河谷帶狀，老市鎮有機巷弄，農村是三合院聚落。街道方位順著海岸線、河谷或主要聯外道路。</li><li>土地使用參考同心圓、扇形與多核心模型：舊城在中心，新商業區朝主要聯外方向，工業區在港口、礦區或次要聯外方向的外緣，高級住宅與大學在另一側，大城市旁設科學園區；約每 800 公尺一個里，配國小、公園與市場。</li><li>工作機會依就業結構配置：商業約四分之一、製造業約三成、辦公約一成五，與臺灣的就業結構相近。</li></ul>'+
  '<h4>地圖</h4><ul><li>底圖可選街道圖（類似 Google 地圖）、地形圖與都市計畫圖（依分區著色）。</li><li>縮放時依序出現：國道與省道編號、主要地標、市區路名（「路」與「街」，依位置分段）、街廓與建物、巷弄與巷號。最大可放大到單一街廓。</li><li>地標以圖示顯示，點一下可看設施與所在城市的資料。</li></ul>'+
  '<h4>法規與政策</h4><ul><li>中央政策全國適用：稅制、移民、生育與托育、醫療、教育、能源、建築耐震、防災、大眾運輸票價、農業。</li><li>縣市法規各縣市自訂：容積與限高、房屋稅與地價稅、都市更新、車站周邊發展（TOD）、招商、社會福利、綠地、防災計畫；環境法規與開發管制可依中央或另訂。</li><li>政策會改變稅收、需求、遷徙吸引力、開發速度、密度上限、災損與運量，也有每月支出，列在統計的財政圖表中。</li></ul>'+
  '<h4>密度怎麼決定</h4><ul><li>分區的「等級」是上限（住一最高到中低密度、住二到中密度、住三可以蓋高樓）。</li><li>每個月，每一格依<b>地區品質</b>（道路、學校、醫療、公園、大眾運輸、污染、災害潛勢、海景）、<b>資源整合程度</b>（道路、捷運、水電、公共服務的涵蓋）與該鄉鎮的<b>市場需求</b>計算目標密度，逐步往上蓋或衰退；每升一級要消耗建材。</li><li>受災超過一定程度的格子不會再開發，直到重建完成。</li></ul>'+
  '<h4>人口為什麼移入移出</h4><ul><li>每個鄉鎮有十一項因素：就業機會、住房供給、公共服務、交通便利、地區品質、生活成本、環境污染、災害與重建、水電供應、行政中心、國際門戶，加權成遷徙吸引力。</li><li>吸引力低於全國平均越多，移出率越高；移出的人依各地吸引力與空屋分配，同縣市、同省的鄉鎮較容易接收。</li><li>國際移民取決於全國平均吸引力、對外航線與財政狀況。</li><li>點選鄉鎮可看各項因素的貢獻；主題圖「遷徙吸引力」「淨遷入率」可看全國分布。</li></ul>'+
  '<h4>交通</h4><ul><li>道路分六級：巷道、鄉道、縣道、省道、快速道路、國道。道路依地形自動選線，沿既有道路拓寬較便宜。</li><li>鐵路與輕軌依地形選線，高鐵與捷運走直線。起點點在既有路線上會成為支線。</li><li>車站周邊的人口與就業決定運量，也提高周邊的地區品質與辦公需求。</li></ul>'+
  '<h4>天災</h4><ul><li>地震震度依臺灣中央氣象署的 0～7 級；低窪近河、近海的鬆軟地層震度較大。</li><li>颱風依路徑造成風災、豪雨淹水、山崩與暴潮；保護區可以降低山崩。</li><li>重建可選原地重建、耐震提升或遷移重建。</li></ul>'+
  '<h4>快捷鍵</h4><ul><li>空白鍵：暫停或繼續；Esc：結束目前的工具；Enter：完成路線；Backspace：刪除最後一個轉折點；＋／－：縮放。</li></ul></div>';};

/* 匯入的地圖工作機會不足時，在主要城鎮外圍補劃工業區（依人口比例） */
function topUpJobs(sets,quiet){var TS=townships(),P=0,J=0,ha=haOf();TS.forEach(function(u){var T=C.T[u.id];P+=T.P;J+=T.J;});var gap=0.5*P*0.94-J;if(gap<=0)return false;
  var need=Math.ceil(gap/(JOB_HA.ind[2]*ha)),big=sets.filter(function(s){return s.kind!=='village';}),tot=sum(big,function(s){return s.pop;})||1,G=growCtx(),MP=C.MP,S=C.S,P0=C.P,n=0;
  var okc=function(k){return P0.zt[k]===0&&!isWater(MP.lc[k])&&S.SL[k]<12;},costf=function(k){return MP.lc[k]>2?1+S.SL[k]*0.15:0;};
  /* 新工業區從既有的工業區（或市區外緣的工業方向）往外長成一片，而不是沿著市區邊緣圍成一圈 */
  var GW=MP.GW,GH=MP.GH,seedOf=function(s,si){var pf=C.cities&&C.cities[si];if(!pf)return K(s);var ip=(C.poiS||[]).filter(function(q){return q.t==='ind'&&q.si===si;})[0];if(ip)return cellK(ip.x,ip.y);
    var th=pf.thInd!=null?pf.thInd:(ih(si,7,3)%628)/100,rr=(pf.Ru||2)*1.15+2;return cellK(clamp(pf.x+Math.cos(th)*rr,0,GW-1),clamp(pf.y+Math.sin(th)*rr,0,GH-1));};
  big.forEach(function(s){var m=Math.round(need*s.pop/tot);if(m<1)return;var si=sets.indexOf(s),L=growFrom(G,seedOf(s,si),m,okc,costf,m*40+20000),gx=0,gy=0;L.forEach(function(k){setZone(k,ZI.ind,2,2);if(P0.sty){P0.sty[k]=5;if(C.cities&&C.cities[si])P0.cid[k]=si;}gx+=kx(k)+0.5;gy+=ky(k)+0.5;n++;});
    if(L.length>=6&&C.poiS){var u=C.U[P0.adm[L[0]]],tn=u?u.name.replace(/[鄉鎮市區]$/,''):s.name;C.poiS.push({t:'ind',x:gx/L.length,y:gy/L.length,name:tn+'工業區',alt:[tn+'產業園區',tn+'第二工業區',tn+'科技工業區'],si:si});}});
  if(n){rebuildZones();countFood();C.dirty.poi=1;if(!quiet)toast('工作機會不足，已在主要城鎮外圍補劃工業區 '+fmt(n)+' 格');}return n>0;}
/* ---------- 匯出：作戰地圖（給作戰模擬） ---------- */
async function warMapObj(){var MP=C.MP,P=C.P,GW=MP.GW,N=GW*MP.GH,lc=MP.lc.slice(),k;
  for(k=0;k<N;k++){if(isWater(lc[k]))continue;var z=P.zt[k],d=P.dn[k];
    if(z===ZI.res){if(d>=4)lc[k]=LCI.city;else if(d===3)lc[k]=LCI.town;else if(d>=1)lc[k]=LCI.sub;}else if(z===ZI.com||z===ZI.off){if(d>=3)lc[k]=LCI.city;else if(d>=1)lc[k]=LCI.town;}
    else if((z===ZI.ind||z===ZI.utl)&&d)lc[k]=LCI.ind;else if(z===ZI.port)lc[k]=LCI.port;else if(z===ZI.park&&d)lc[k]=LCI.park;else if((z===ZI.gov||z===ZI.emg||z===ZI.edu)&&d)lc[k]=LCI.town;else if(z===ZI.air)lc[k]=LCI.mead;
    if(MP.dmg[k]>200&&(zDev(z)||zPub(z)))lc[k]=LCI.rubble;}
  C.lines.forEach(function(L){if((L.kind==='rail'||L.kind==='hsr')&&L.built>=1)L.st.forEach(function(q){if(!isWater(lc[q]))lc[q]=LCI.rly;});});
  var brg=[];for(k=0;k<N;k++){if((MP.rd[k]||(MP.rl[k]&1))&&!MP.tn[k]&&(MP.rv[k]>=2||lc[k]===LCI.riv))brg.push({x:k%GW,y:(k/GW)|0,c:Math.max(MP.rv[k],lc[k]===LCI.riv?3:0),t:'p'});}
  var set=townships().map(function(u){var T=C.T[u.id],p=Math.round(T?T.P:0),kind=p>=50000?'city':p>=5000?'town':'village';return {x:+(kx(u.seat)+0.5).toFixed(2),y:+(ky(u.seat)+0.5).toFixed(2),pop:p,kind:kind,r:Math.round(Math.sqrt(p/(kind==='city'?6500:kind==='town'?4500:2500)/PI)*1000),name:u.name.replace(/[鄉鎮區]$/,'')};}).filter(function(s){return s.pop>0;});
  var m={v:1,format:'LatoWarMap',name:C.name+'（'+ym(C.t)+'）',seed:MP.seed,GW:MP.GW,GH:MP.GH,cs:MP.cs,Wm:MP.GW*MP.cs,Hm:MP.GH*MP.cs,year:C.y0+Math.floor(C.t/12),lat0:MP.lat0||24,lon0:MP.lon0||121,src:'city',world:null,pcs:MP.pcs||Math.max(3,Math.round(550/MP.cs)),dev:0.85,nst:'zh',
    clim:MP.clim||{Tj:16,Tl:29,Pj:120,Pl:330},nations:MP.nations||[],rivs:MP.rivs||[],lbl:MP.lbl||[],brg:brg,set:set,popD:C.N.P/Math.max(1,sum(townships(),function(u){return u.area||0;})),Ptot:C.N.P};
  var arr={el:MP.el,lc:lc,rv:MP.rv,rd:MP.rd,rl:MP.rl,ft:MP.ft,nat:MP.nat,dmg:MP.dmg,tn:MP.tn};for(var i=0;i<MAPTA.length;i++)m[MAPTA[i]]=await packTA(arr[MAPTA[i]]);return m;}
/* ---------- 規劃檔 ---------- */
async function cityObj(){var MP=C.MP,P=C.P,m={},p={},i;Object.keys(MP).forEach(function(k){if(MAPTA.indexOf(k)<0&&k.charCodeAt(0)!==95&&typeof MP[k]!=='function')m[k]=MP[k];});m.format='LatoWarMap';
  for(i=0;i<MAPTA.length;i++)if(MP[MAPTA[i]])m[MAPTA[i]]=await packTA(MP[MAPTA[i]]);for(i=0;i<PLANTA.length;i++)p[PLANTA[i]]=await packTA(P[PLANTA[i]]);
  var U=C.U.map(function(u){var o={};Object.keys(u).forEach(function(k){if(k!=='sc')o[k]=u[k];});return o;});
  var lines=C.lines.map(function(L){return {id:L.id,kind:L.kind,g:L.g,name:L.name,col:L.col,pts:Array.from(L.pts),wp:L.wp,st:L.st,par:L.par,built:L.built,cut:L.cut,t0:L.t0,len:L.len,cost:L.cost,months:L.months,riders:L.riders,rh:L.rh};});
  var noTmp=function(a){return (a||[]).map(function(x){var o={};Object.keys(x).forEach(function(k){if(k.charCodeAt(0)!==95)o[k]=x[k];});return o;});};
  var rec=[];for(i=0;i<C.rec.length;i++){var q=C.rec[i];rec.push({ev:q.ev,name:q.name,cells:await packTA(q.cells),tot:q.tot,pos:q.pos,mode:q.mode,done:q.done,left:q.left,tEnd:q.tEnd});}
  return {format:'LatoCity',v:1,saved:new Date().toISOString(),name:C.name,seed:C.seed,map:m,plan:p,U:U,lines:lines,routes:C.routes,ext:C.ext,facN:C.facN,ev:C.ev.map(function(e){var o=Object.assign({},e);delete o._ln;return o;}),rec:rec,T:C.T,R:C.R,t:C.t,y0:C.y0,hist:C.hist,opt:C.opt,nid:C.nid,nmc:C.nmc,faults:C.faults,geo:C.geo||null,xst:C.xst,stN:C.stN||{},cities:noTmp(C.cities),streets:noTmp(C.streets),nbh:C.nbh||[],poiS:C.poiS||[],ics:C.ics||[],pol:C.pol||polDefault()};}
async function loadCity(o){setSpeed(0);loading('讀取規劃檔',0.1);await yld();
  try{resetState();var m=o.map,MP={},i;Object.keys(m).forEach(function(k){MP[k]=m[k];});for(i=0;i<MAPTA.length;i++)if(typeof m[MAPTA[i]]==='string')MP[MAPTA[i]]=await unpackTA(m[MAPTA[i]]);C.MP=MP;C.seed=o.seed||MP.seed||'city';
    planInit();for(i=0;i<PLANTA.length;i++)if(o.plan[PLANTA[i]])C.P[PLANTA[i]]=await unpackTA(o.plan[PLANTA[i]]);
    C.U=o.U;C.lines=o.lines.map(function(L){L.pts=L.pts||[];return L;});C.routes=o.routes||[];C.ext=o.ext||[];C.facN=o.facN||[];C.ev=o.ev||[];C.T=o.T||{};C.R=o.R;C.t=o.t||0;C.y0=o.y0||2025;C.hist=o.hist||[];Object.assign(C.opt,o.opt||{});C.nid=o.nid||1e5;C.nmc=o.nmc||{};C.faults=o.faults||[];C.geo=o.geo||null;C.xst=o.xst||[];C.stN=o.stN||{};C.name=o.name||MP.name||'';
    C.rec=[];for(i=0;i<(o.rec||[]).length;i++){var q=o.rec[i];q.cells=await unpackTA(q.cells);C.rec.push(q);}
    C.NM=new Namer(C.seed);C.U.forEach(function(u){C.NM.use(u.name.slice(0,2));});(MP.set||[]).forEach(function(s){if(s.name)C.NM.use(s.name);});
    C.pol=o.pol||polDefault();
    await prog('重建圖層',0.5);statics();
    if(o.cities&&o.streets){C.cities=o.cities;C.streets=o.streets;C.nbh=o.nbh||[];C.poiS=o.poiS||[];C.ics=o.ics||[];rasterStreets();}
    else{/* 舊版規劃檔：由鄉鎮治所推出城市與街道 */var sets=(MP.set||[]).filter(function(s){return s.kind==='city'||s.kind==='town'||s.kind==='village';}).map(function(s){return {x:s.x,y:s.y,pop:s.pop||500,kind:s.kind,r:s.r||600,name:s.name||''};});
      if(!sets.length)sets=C.U.filter(function(u){return u.lv===3&&!u.dead;}).map(function(u){var T=C.T[u.id]||{},p=T.P||1000;return {x:kx(u.seat)+0.5,y:ky(u.seat)+0.5,pop:p,kind:p>=50000?'city':p>=5000?'town':'village',r:600,name:u.name.replace(/[鄉鎮市區]$/,''),cap:u.capital?1:0};});
      sets.sort(function(a,b){return b.pop-a.pop;});if(sets[0])sets[0].cap=1;deriveCities(sets);C.lver=(C.lver||0)+1;interchanges();gasStations();}
    rebuildRaster();finishSetup(false);toast('已開啟「'+C.name+'」（'+ym(C.t)+'）');}
  catch(e){console.error(e);toast('開啟失敗：'+e.message,true);}loading(null);}
async function openFile(f){try{loading('讀取檔案',0.02);var txt=await f.text(),o=JSON.parse(txt);loading(null);
    if(o.format==='LatoCity')await loadCity(o);else if(o.format==='LatoWarMap')await importWar(o);else if(o.map&&o.map.format==='LatoWarMap')await importWar(o.map);else throw new Error('不是規劃檔或作戰地圖（format：'+(o.format||'無')+'）');}
  catch(e){loading(null);toast('無法開啟：'+e.message,true);}}
/* 下載：在 claude.ai 的預覽框中改用平台的下載功能（會先請使用者確認），其他環境用一般的下載連結 */
var DLNS=null;try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(function(d){DLNS=d||null;},function(){});}catch(e){}
function download(name,data,type){var b=data instanceof Blob?data:new Blob([data],{type:type||'application/json'});
  if(DLNS){DLNS.save({filename:name,data:b}).then(function(){toast('已儲存「'+name+'」');},function(e){var c=e&&e.code;if(c==='declined')return;toast(c==='too_large'?'檔案太大，這裡無法下載':c==='rate_limited'?'上一個下載還在等待確認，請稍後再試':'這個檢視畫面無法下載檔案',true);});return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);}
function fileBase(){return (C.name||'latocity').replace(/[\\/:*?"<>|\s]+/g,'_')+'_'+(C.y0+Math.floor(C.t/12))+'-'+(C.t%12+1);}
async function saveCity(){loading('打包規劃檔',0.3);try{var o=await cityObj();download(fileBase()+'.latocity.json',JSON.stringify(o));toast('已下載規劃檔');}catch(e){toast('打包失敗：'+e.message,true);}loading(null);}
async function saveWar(){loading('換算作戰地圖',0.3);try{var o=await warMapObj();download(fileBase()+'.latowarmap.json',JSON.stringify(o));toast('已下載作戰地圖，可在作戰模擬開啟');}catch(e){toast('換算失敗：'+e.message,true);}loading(null);}
function savePNG(){draw();CV.toBlob(function(b){if(b)download(fileBase()+'.png',b,'image/png');},'image/png');}
/* ---------- 瀏覽器暫存（IndexedDB） ---------- */
function idb(){return new Promise(function(res,rej){var q=indexedDB.open('latoCity',1);q.onupgradeneeded=function(){q.result.createObjectStore('s');};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});}
async function quickSave(){try{loading('存到這台電腦',0.3);var o=await cityObj(),db=await idb();await new Promise(function(res,rej){var t=db.transaction('s','readwrite');t.objectStore('s').put(JSON.stringify(o),'quick');t.oncomplete=res;t.onerror=function(){rej(t.error);};});toast('已存到這台電腦（'+ym(C.t)+'）');}catch(e){toast('無法存到瀏覽器：'+e.message,true);}loading(null);}
async function quickLoad(){try{var db=await idb(),s=await new Promise(function(res,rej){var q=db.transaction('s').objectStore('s').get('quick');q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};});if(!s){toast('這台電腦上還沒有暫存',true);return;}await loadCity(JSON.parse(s));}catch(e){toast('讀取失敗：'+e.message,true);}}
function onEvent(e){if(TAB==='dis')renderLeft();renderRight();topBar();}
/* ---------- 啟動 ---------- */
function boot(){buildUI();loadIcons();requestAnimationFrame(loop);newMap(NEWO);}
window.LatoCity={C:function(){return C;},LY:LY,polSet:polSet,polRefresh:polRefresh,req:req,draw:draw,buildPOI:buildPOI,simStep:simStep,runDisaster:runDisaster,typhoonTrack:typhoonTrack,setView:setView,select:select,newMap:newMap,importWar:importWar,warMapObj:warMapObj,cityObj:cityObj,loadCity:loadCity};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
