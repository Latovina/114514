<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界地形與氣候圖層工具</title>
<style>
/* ===== LatoTools 共用樣式（MediaWiki:Gadget-LatoTools.css 已有，不必重貼） ===== */
.lato-tool{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px;color:#222;}
.lato-tool .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:13px;color:#555;margin:0 0 10px;}
.lato-tool input[type=number]{width:74px;}
.lato-tool input[type=color]{width:34px;height:26px;padding:0;border:1px solid #ccc;border-radius:4px;vertical-align:middle;}
.lato-tool input[type=range]{width:90px;vertical-align:middle;}
.lato-tool button{padding:4px 12px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;cursor:pointer;font-size:13px;}
.lato-tool button:hover{background:#f0f0f0;}
.lato-tool .lt-cv{width:100%;min-height:120px;display:block;border:1px solid #ccc;border-radius:8px;background:#f6f6f6;}
.lato-tool .lt-err{color:#b3261e;font-size:13px;margin:0 0 8px;min-height:1em;}
.lato-tool .lt-info{font-size:13px;color:#555;margin:0 0 8px;line-height:1.7;}
.lato-tool .lt-chip{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #ccc;vertical-align:middle;margin-left:4px;}
.lato-tool .lt-cl{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:12px;}
.lato-tool .lt-mk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid #b3261e;border-radius:50%;pointer-events:none;display:none;}
.lt-terrain .lt-scroll{max-height:260px;overflow:auto;margin:4px 0;}
.lt-terrain .lt-scroll input[type=number]{padding:1px 3px;font-size:12px;}
/* ===== LatoTerrain 新增：以下附加到 MediaWiki:Gadget-LatoTools.css 末尾（取代舊版 LatoTerrain 區塊） ===== */
.lato-tool select,.lato-tool input[type=text]{font-size:13px;padding:3px 6px;border:1px solid #aaa;border-radius:6px;background:#fff;color:#222;}
.lato-tool button:disabled{opacity:.45;cursor:default;background:#fff;}
.lato-tool .lt-pri{background:#222;border-color:#222;color:#fff;}
.lato-tool .lt-pri:hover{background:#444;}
.lato-tool .lt-pri:disabled{background:#222;color:#fff;opacity:.35;}
.lato-tool .lt-sl{display:inline-flex;align-items:center;gap:6px;}
.lato-tool .lt-sl output{min-width:2.4em;color:#222;font-variant-numeric:tabular-nums;}
.lato-tool .lt-bar{height:3px;background:#e6e6e6;border-radius:2px;overflow:hidden;margin:0 0 8px;}
.lato-tool .lt-bar>div{height:100%;width:0;background:#555;}
.lato-tool .lt-grp{border:1px solid #ddd;border-radius:8px;padding:0 10px;margin:0 0 8px;}
.lato-tool .lt-grp>summary{cursor:pointer;padding:6px 0;font-size:13px;color:#333;}
.lato-tool .lt-tbl{border-collapse:collapse;font-size:12px;color:#555;margin:0 0 6px;}
.lato-tool .lt-tbl td{padding:1px 14px 1px 0;text-align:right;font-variant-numeric:tabular-nums;}
.lato-tool .lt-tbl td:first-child{text-align:left;}
.lato-tool textarea{width:100%;max-width:320px;box-sizing:border-box;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid #ccc;border-radius:6px;padding:6px;margin:0 0 8px;}
.lt-terrain .lt-cv{cursor:crosshair;}
.lt-terrain .lt-chip{margin:0 5px 0 0;}
.lato-tool .lt-box{border:1px solid #ddd;border-radius:8px;padding:8px 10px;margin:8px 0;}
.lato-tool .lt-h{font-size:13px;color:#333;margin:0 0 6px;}
.lato-tool .lt-lr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:3px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.lato-tool .lt-lr>label:first-child{min-width:180px;}
.lato-tool .lt-lr>button{padding:2px 10px;font-size:12px;}
.lato-tool .lt-sub{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:#555;}
.lato-tool .lt-mt{margin-top:8px;}
.lato-tool .lt-leg{font-size:12px;color:#444;margin:0 0 8px;line-height:1.9;}
.lato-tool .lt-leg b{display:block;font-weight:600;color:#333;line-height:1.6;}
.lato-tool .lt-leg span{display:inline-flex;align-items:center;margin:0 12px 0 0;}
.lato-tool .lt-outs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0;}
.lato-tool .lt-outs figure{margin:0;width:150px;font-size:11px;color:#555;}
.lato-tool .lt-outs img{display:block;width:100%;border:1px solid #ddd;border-radius:4px;background:#eee;}
.lato-tool .lt-outs figcaption{word-break:break-all;margin-top:2px;}
.lt-terrain .lt-rt{display:block;overflow-x:auto;white-space:nowrap;max-width:100%;}
.lt-terrain .lt-rt td{padding-right:10px;}
.lato-tool .lt-gl{font-size:15px;line-height:1;margin:0 4px 0 0;}
</style>

  if(k==='shade')return ''+o.shadeStr;if(k==='river')return ''+o.src+o.main+o.trib+o.mouth+o.lake;return '';}

  var T=L.target(st.g.W,st.g.H,st.g.ee,st.g.cls,st.res.h,st.g.hl),cv=L.layerCanvas(k,T,data(false),o,document);st.cache[s]=cv;return cv;}
function outlineBuf(W,H,rid,hl,wd,color,sel){if(!rid)return hlBuf(W,H,hl,wd,color);var d=new Uint8ClampedArray(W*H*4),c=C.hex(color);
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=y*W+x,r=rid[i];if(!r)continue;var edge=x===0||y===0||x===W-1||y===H-1||rid[i-1]!==r||rid[i+1]!==r||rid[i-W]!==r||rid[i+W]!==r;
    if(edge){for(var b=1-wd;b<wd;b++)for(var a=1-wd;a<wd;a++){var xx=x+a,yy=y+b;if(xx<0||yy<0||xx>=W||yy>=H)continue;var j=yy*W+xx;if(rid[j]!==r)continue;d[j*4]=c[0];d[j*4+1]=c[1];d[j*4+2]=c[2];d[j*4+3]=255;}}
    else if(sel&&r===sel){var q2=i*4;if(!d[q2+3]){d[q2]=c[0];d[q2+1]=c[1];d[q2+2]=c[2];d[q2+3]=64;}}}
  return d;}
function hlBuf(W,H,hl,wd,color){var d=new Uint8ClampedArray(W*H*4),c=C.hex(color);
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){var i=y*W+x;if(!hl[i])continue;if(x&&x<W-1&&y&&y<H-1&&hl[i-1]&&hl[i+1]&&hl[i-W]&&hl[i+W])continue;

(function(){var cv=q('cv'),drag=null;

  function rub(p,d){var r=CT.erase(ctK(),st.ct,p[0],p[1],+q('ctType').value||3);if(!r.n)return;var ids={};d.rem.E.forEach(function(e){ids[e.id]=1;});r.E.forEach(function(e){if(!ids[e.id]){d.rem.E.push(e);ids[e.id]=1;}});d.rem.S=d.rem.S.concat(r.S);d.rem.F=d.rem.F.concat(r.F);d.rem.V=d.rem.V.concat(r.V);d.n+=r.n;compose();}

  cv.addEventListener('pointerdown',function(e){if(!st.ctTool||!st.g||st.busy||!st.riv)return;e.preventDefault();var p=bxy(e),t=st.ctTool,ty=q('ctType').value;ctEnsure();var K=ctK();err('');

      var before=st.ct.A.N.map(function(x){return Object.assign({},x);}),nm=q('ctName').value.trim(),r3=CT.admName(K,st.ct,nid,+ty||1,p[0],p[1],nm);if(r3.err){err(r3.err);return;}
      st.ctU.push({admN:before});ctDone((nm?'已命名為「'+nm+'」':'已移除名稱')+'（'+CT.ADM[(+ty||1)-1][1]+'，'+r3.km2.toLocaleString('en-US')+' km²）。');ctAdmList();return;}

  cv.addEventListener('pointermove',function(e){if(!drag)return;var p=bxy(e);if(drag.adm){var la=drag.adm[drag.adm.length-1];if(la[0]!==p[0]||la[1]!==p[1]){drag.adm.push(p);live(drag.adm,CT.ADM[drag.lv-1][2],2);}return;}if(drag.arem){arub(p,drag);return;}if(drag.pts){var l=drag.pts[drag.pts.length-1];if(l[0]!==p[0]||l[1]!==p[1]){drag.pts.push(p);live(drag.pts);}}else if(drag.rem)rub(p,drag);});

  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&st.ctA){st.ctA=null;compose();}});})();
q('ctUndo').addEventListener('click',function(){var u=st.ctU.pop(),c=st.ct;if(!u||!c)return;
