<style>

.lato-tool button:hover{background:#f0f0f0;}

.lt-terrain .lt-scroll{max-height:260px;overflow:auto;margin:4px 0;}
.lt-terrain .lt-scroll input[type=number]{padding:1px 3px;font-size:12px;}

.lg-txt{white-space:pre-wrap;font-size:13px;}

.lg-prog>i{display:block;height:100%;width:0;background:#444;transition:width .2s;}

.lg-cv,.lg-svg{position:absolute;left:0;top:0;width:100%;height:100%;}

.lg-svg .t12{font-size:calc(var(--k)*12px);}.lg-svg .t15{font-size:calc(var(--k)*15px);}.lg-svg .t18{font-size:calc(var(--k)*18px);}
.lg-svg .g8{font-size:calc(var(--k)*8px);}.lg-svg .g9{font-size:calc(var(--k)*9px);}.lg-svg .g10{font-size:calc(var(--k)*10px);}.lg-svg .g12{font-size:calc(var(--k)*12px);}.lg-svg .g13{font-size:calc(var(--k)*13px);}.lg-svg .g14{font-size:calc(var(--k)*14px);}.lg-svg .g16{font-size:calc(var(--k)*16px);}.lg-svg .g22{font-size:calc(var(--k)*22px);}
.lg-svg .nl{font-weight:700;letter-spacing:.08em;fill:#3E2723;stroke-width:calc(var(--k)*3.5px);opacity:.92;}
.lg-svg .pl{fill:#4E342E;font-style:italic;}
.lg-svg .ct{fill:#212121;stroke-width:calc(var(--k)*1.6px);}.lg-svg .ctn{fill:#111;text-anchor:start;}
.lg-svg .fcb{stroke:#fff;stroke-width:calc(var(--k)*1px);}.lg-svg .fcx{opacity:.45;}.lg-svg .fct{fill:#fff;stroke:none;font-weight:700;}
.lg-svg .unb{stroke:#111;stroke-width:calc(var(--k)*1px);}.lg-svg .unw{stroke:#C62828;stroke-width:calc(var(--k)*2px);}.lg-svg .unc{fill:#111;font-weight:700;}.lg-svg .unn{fill:#263238;}
.lg-svg .htb{stroke:#fff;stroke-width:calc(var(--k)*1.4px);opacity:.92;}.lg-svg .htt{fill:#fff;stroke:none;font-weight:700;}
.lg-svg .dep{stroke:#fff;stroke-width:calc(var(--k)*1px);}.lg-svg .depu{opacity:.5;}.lg-svg .depn{fill:#424242;}
.lg-svg .bat{fill:#B71C1C;}.lg-svg .selm{fill:none;stroke:#00B0FF;stroke-width:calc(var(--k)*1.4px);}

.lg-svg .prjl{stroke:#6A1B9A;stroke-width:2px;stroke-dasharray:5 4;}

.lg-svg .mv{stroke:#0D47A1;stroke-width:1.8px;stroke-dasharray:5 3;}

.lg-side{display:flex;flex-direction:column;gap:10px;min-width:0;}

.lg-dlgbox>h3{margin:0 0 10px;font-size:16px;}

.lg-busy{position:fixed;inset:0;z-index:130;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:15px;}

#lato-game details>summary{cursor:pointer;font-size:13px;color:#444;margin:4px 0;}
.lg-grid.c2{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);}
@media (max-width:860px){.lg-grid.c2{grid-template-columns:1fr;}}

.lg-legend details.lg-hl div{display:flex;flex-wrap:wrap;gap:2px 8px;margin:2px 0;}
.lg-legend b.hg{display:inline-block;min-width:15px;padding:0 2px;margin-right:2px;border-radius:7px;color:#fff;font-size:10px;line-height:15px;text-align:center;font-weight:700;}

ACT['war.declare']=function(o){var N=Nn(o),T=G.nat[o.to];if(!T||!T.alive||T.i===N.i)return no('對象錯誤');if(atWar(N.i,T.i))return no('已在交戰');if(hasPol(N,'neutral'))return no('奉行中立政策，不能主動宣戰');if(hasTr(N.i,T.i,'truce'))return no('停戰協定期間不能宣戰');
  var cb=rel(N.i,T.i).ten>50,pp=cb?15:35;if(N.pts.pp<pp)return no('政治點數不足（需 '+pp+'）');if(democ(N)>=6&&N.st.warSup<40&&!o.force)return no('戰爭支持度不足 40（民主國家須先取得國會與民意支持）');
  N.pts.pp-=pp;if(hasTr(N.i,T.i,'nap')){N.st.prest=clamp(N.st.prest-20,0,100);}var w=declareWar(N.i,T.i,o.goal||'conquer',o.txt||'');if(!cb)N.st.prest=clamp(N.st.prest-10,0,100);return w?ok('已向'+T.name+'宣戰'):no('宣戰失敗');};
ACT['dip.msg']=function(o){if(o.to!==-1&&!G.nat[o.to])return no('對象錯誤');if(o.n===-1&&o.to===-1)return no('對象錯誤');if(!has(o.txt)&&!o.img)return no('請輸入訊息');sendMsg(o.n,o.to,o.txt,o.img);return ok('已送出');};
ACT['dip.req']=function(o){var N=Nn(o);if(!G.nat[o.to]||o.to===o.n)return no('對象錯誤');if(!REQI[o.k])return no('未知的請求');var cost=o.k==='custom'?1:o.k==='treaty'?3:2;if(N.pts.dp<cost)return no('外交點數不足（需 '+cost+'）');N.pts.dp-=cost;var q=sendReq(o.n,o.to,o.k,o.pay||{},o.txt||'');return ok('已送出請求（AI 接受機率約 '+pct(aiJudge(q).p*100,0)+'）');};
ACT['dip.answer']=function(o){var q=G.dip.reqs.filter(function(x){return x.id===o.q;})[0];if(!q||q.to!==o.n||q.st!=='pend')return no('沒有待回覆的請求');answerReq(q,!!o.acc,o.txt||'');return ok(o.acc?'已接受':'已拒絕');};
ACT['dip.unil']=function(o){if(!G.nat[o.to])return no('對象錯誤');var N=Nn(o);if(o.on&&N.pts.dp<3)return no('外交點數不足（需 3）');if(o.on)N.pts.dp-=3;unil(o.n,o.to,o.k,!!o.on);return ok();};
ACT['dip.end']=function(o){if(!delTr(o.n,o.to,o.k))return no('沒有這項條約');var N=Nn(o);rel(o.n,o.to).op=clamp(rel(o.n,o.to).op-15,-100,100);if(o.k==='ally'||o.k==='def')N.st.prest=clamp(N.st.prest-5,0,100);return ok('已終止條約');};

ACT['chr.new']=function(o){var N=Nn(o);if(N.pts.ap<2)return no('行政點數不足（需 2）');N.pts.ap-=2;var r=mb32(hstr(G.seed+'|chr|'+(o.seed||G.t+'|'+G.chars.length)));var c=makeChar(N.i,o.role||'other',{name:o.name,bg:o.bg,img:o.img,bio:o.bio,tr:o.tr},r,o.man||{});G.chars.push(c);if(o.post)appoint(c.id,o.post);return ok('已建立人物「'+c.name+'」');};

async function packGame(withWorld){var o={},k;for(k in G){if(k.charAt(0)==='_'||k==='tile')continue;o[k]=G[k];}
  var s=JSON.stringify(o,function(key,v){if(key.charAt(0)==='_'&&key!=='_once')return undefined;return v;});o=JSON.parse(s);
  o.tile={own:await packTA(G.tile.own),pv:await packTA(G.tile.pv),ctl:await packTA(G.tile.ctl)};if(withWorld)o.world=await packWorld(W);if(W&&W._dirty&&!withWorld)o.worldPatch=await packWorld(W);return o;}
async function unpackGame(o,Wd){if(!o||o.format!=='LatoGame')throw new Error('這不是國家文遊模擬器的存檔（.latogame.json）。');var g=o,k;var t=g.tile;g.tile={own:await unpackTA(t.own),pv:await unpackTA(t.pv),ctl:await unpackTA(t.ctl)};
  var w=Wd;if(o.world){w=await unpackWorld(o.world);delete g.world;}if(o.worldPatch){w=await unpackWorld(o.worldPatch);delete g.worldPatch;}if(!w)throw new Error('存檔中沒有世界資料');g._x=null;return {G:g,W:w};}

  o.orders.forEach(function(x){if(x.img&&G.img[x.img])im[x.img]=G.img[x.img];});o.imgs=im;return o;}
function importOrders(o){if(!o||o.format!=='LatoGameOrders')return {ok:false,msg:'這不是指令檔'};if(o.game!==G.id)return {ok:false,msg:'指令檔屬於另一場遊戲'};if(o.turn!==G.t)return {ok:false,msg:'指令檔是第 '+(o.turn+1)+' 回合的，目前是第 '+(G.t+1)+' 回合'};
  if(o.imgs)for(var ik in o.imgs)if(/^img\w+$/.test(ik)&&/^data:image\//.test(o.imgs[ik]))G.img[ik]=o.imgs[ik];var done={},n=0,bad=[];G.olog.forEach(function(x){if(x.oid&&x.n===o.nation)done[x.from||x.oid]=1;});o.orders.forEach(function(x){if(done[x.oid])return;var y=clone(x);y.from=x.oid;delete y.oid;var r=act(y);if(r.ok)n++;else bad.push((x.type||'')+'：'+r.msg);});
  return {ok:true,msg:'已執行 '+n+' 項指令'+(bad.length?'；'+bad.length+' 項失敗：'+bad.slice(0,5).join('、'):'')};}

  if(EVSTAT.indexOf(k)>=0||PTSI[k]||EFFN.indexOf(k)>=0)return true;if(k.indexOf('mod.')===0)return !!MODI[k.slice(4)];if(k.indexOf('fac.')===0)return !!byKey(FACT,k.slice(4));if(k.indexOf('resP.')===0)return !!RESI[k.slice(5)];if(k.indexOf('techBoost.')===0)return TECHI[k.slice(10)]!==undefined;return false;}
function parseEff(src,sc){var eff=[],err=[];String(src||'').split(/\n/).forEach(function(line,li){var s=line.trim();if(!s||s.charAt(0)==='#')return;var w=s.split(/[\s,，、]+/),L='第 '+(li+1)+' 行：';if(w.length<3){err.push(L+'格式應為「對象 鍵 數值 [年數]」');return;}
    var tg=w[0],k=w[1],v=w[2],y=w[3];if(['n','p','o','a','g'].indexOf(tg)<0){err.push(L+'未知的對象「'+tg+'」');return;}if(!effKeyOK(tg==='a'||tg==='o'?'n':tg,k)){err.push(L+'對象 '+tg+' 沒有「'+k+'」這個鍵');return;}
    if(tg==='p'&&sc!=='p')err.push(L+'p（行政區）只能用在範圍為「行政區」的事件');if(tg==='o'&&sc!=='pair')err.push(L+'o（對方國家）只能用在範圍為「兩國之間」的事件');if(sc==='g'&&(tg==='n'||tg==='p'||tg==='o'))err.push(L+'全球事件請用 a（所有國家）或 g（全球）');
    var val;if(k==='hot'){if(!HOT[v])err.push(L+'未知的熱點類型「'+v+'」（可用：'+Object.keys(HOT).join('、')+'）');val=v;}else if(k==='chain')val=v;else if(isFinite(+v))val=+v;else{var ce=exCheck(v,evVarOK);if(ce)err.push(L+ce);val=v;}
    var e=[tg,k,k==='hot'||k==='chain'||k==='coupRoll'?'=':'+',val];if(y!==undefined&&y!==''){if(!isFinite(+y))err.push(L+'年數須為數字');else e.push(+y);}eff.push(e);});return {eff:eff,err:err};}
function effLines(L){return (L||[]).map(function(e){return e[0]+' '+e[1]+' '+(typeof e[3]==='string'?e[3].replace(/\s+/g,''):e[3])+(e[4]!==undefined?' '+e[4]:'');}).join('\n');}

/* ===================== 儲存與檔案：瀏覽器資料庫、下載與讀取、指令檔、開始畫面與新遊戲精靈、回合結算 ===================== */
var IDB=null;
function idb(){return new Promise(function(res){if(IDB)return res(IDB);if(typeof indexedDB==='undefined')return res(null);try{var r=indexedDB.open('LatoGame',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){IDB=r.result;res(IDB);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function idbDo(mode,fn){return idb().then(function(db){if(!db)return null;return new Promise(function(res){try{var tx=db.transaction('kv',mode),st=tx.objectStore('kv'),q=fn(st);tx.oncomplete=function(){res(q&&q.result!==undefined?q.result:true);};tx.onerror=function(){res(null);};}catch(e){res(null);}});});}
function idbPut(k,v){return idbDo('readwrite',function(s){return s.put(v,k);});}
function idbGet(k){return idbDo('readonly',function(s){return s.get(k);});}
function idbDel(k){return idbDo('readwrite',function(s){return s.delete(k);});}
function idbKeys(){return idbDo('readonly',function(s){return s.getAllKeys();});}

AU.fSaveAs=async function(){var s='slot'+Date.now().toString(36);busy(true,'存檔中…');try{await saveLocal(s);busy(false);toast('已另存：'+s);}catch(e){busy(false);toast('存檔失敗：'+e.message);}};
AU.fDl=async function(){busy(true,'打包存檔…');try{var o=await packGame(true);dl(fname('.latogame.json'),JSON.stringify(o));busy(false);}catch(e){busy(false);toast('下載失敗：'+e.message);}};
AU.fLoad=async function(){var f=root.querySelector('[name=ldfile]').files[0];if(!f){toast('請選擇存檔');return;}try{busy(true,'讀取存檔…');var o=JSON.parse(await readFile(f,true)),r=await unpackGame(o,o.world?null:W);await loadBaseImage(r.W);UI.dlg=null;startLoaded(r);}catch(e){busy(false);toast('讀取失敗：'+e.message);}};
AU.fHome=function(){G=null;W=null;MAP.host=null;UI.dlg=null;bootStart();};
AU.ordExp=function(){var n=UI.view;if(n<0){toast('請先選擇國家');return;}var o=exportOrders(n);dl(fname('-'+G.nat[n].name+'.latoorders.json'),JSON.stringify(o,null,1));toast('已匯出 '+o.orders.length+' 項指令');};
AU.ordImp=async function(){var fs=root.querySelector('[name=ordfile]').files,msg=[];for(var i=0;i<fs.length;i++){try{var o=JSON.parse(await readFile(fs[i],true)),r=importOrders(o);msg.push(fs[i].name+'：'+r.msg);}catch(e){msg.push(fs[i].name+'：'+e.message);}}G._ovs=(G._ovs||0)+1;UI.dlg=null;refresh();dlg('匯入指令檔','<ul class="lg-list">'+msg.map(function(m){return '<li>'+esc(m)+'</li>';}).join('')+'</ul>');};
AU.evExp=function(){dl('lato-events.latoevents.json',JSON.stringify({format:'LatoGameEvents',v:1,events:G.evd},null,1));};
AU.evImp=async function(){var f=root.querySelector('[name=evfile]').files[0];if(!f)return;try{var o=JSON.parse(await readFile(f,true));if(o.format!=='LatoGameEvents')throw new Error('不是事件包');var n=0;o.events.forEach(function(e){if(!e.id)return;G.evd=G.evd.filter(function(x){return x.id!==e.id;});G.evd.push(e);n++;});toast('已匯入 '+n+' 個事件');}catch(e){toast('匯入失敗：'+e.message);}};
/* ---------- 啟動 ---------- */
function boot(){root.addEventListener('click',onClick);root.addEventListener('change',onChange);bootStart().then(function(){if(!libOK()){var s=root.querySelector('.lg-start');if(s)s.insertAdjacentHTML('afterbegin','<p class="lg-bad">找不到地形工具的程式庫（LatoTerrainLib），無法建立新世界；仍可讀取含世界資料的存檔。</p>');}});}
var API={newGame:newGame,endTurn:endTurn,act:act,feas:feas,packGame:packGame,unpackGame:unpackGame,useGame:useGame,worldFromMap:worldFromMap,packWorld:packWorld,unpackWorld:unpackWorld,DEMO:function(){return DEMO_MAP;},NB:NB,render:render,refresh:refresh,doEndTurn:doEndTurn,saveLocal:saveLocal,loadBaseImage:loadBaseImage,MAP:MAP,mapCenter:mapCenter,AU:AU,AC:AC,IX:IX,siteOK:siteOK,capCity:capCity,provsOf:provsOf,unitsOf:unitsOf};
boot();
})();
</script>
